name: Build Index

# Every derived artifact (0-Index.md, the subfolder tables, the README nav and
# index.html) is generated from resource frontmatter by scripts/build.py.
# CI re-runs it so the committed copies can never drift from the sources.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Semantic checks (frontmatter, tags, dead links, changelog)
        run: python3 scripts/check_consistency.py

      - name: Rebuild generated artifacts
        run: python3 scripts/build.py

      - name: Commit & push if anything changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rebuild generated indexes [skip ci]"
            git push
            echo "regenerated and pushed"
          else
            echo "all artifacts already up to date"
          fi
