name: Build Index

# Regenerate index.html from README.md / 0-Resources whenever content is pushed.
# The generator is idempotent (date derived from git history), and the auto-commit
# is marked [skip ci], so this cannot loop.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so generated_date() can read git log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate index.html
        run: python3 scripts/generate_index.py

      - name: Commit & push if changed
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: regenerate index.html [skip ci]"
            git push
            echo "index.html regenerated and pushed"
          else
            echo "index.html already up to date"
          fi
