<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Learning Journey · 学习路径</title>
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-hover: #f1f5f9;
  --ink: #0f172a;
  --muted: #475569;
  --faint: #94a3b8;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --accent: #2563eb;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}

html[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #181b20;
  --surface-hover: #22262e;
  --ink: #f1f5f9;
  --muted: #94a3b8;
  --faint: #64748b;
  --border: #2a2f3a;
  --border-strong: #3f4756;
  --accent: #3b82f6;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, input { font-family: inherit; }

/* 顶部导航 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topin {
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 28px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.2px;
  white-space: nowrap;
}
.brand span {
  color: var(--faint);
  font-size: 13px;
  font-weight: 400;
  margin-left: 8px;
}
.spacer { flex: 1; }
.tbtn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tbtn:hover {
  color: var(--ink);
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

/* 图标按钮 */
.ibtn{width:34px;height:34px;flex-shrink:0;display:inline-grid;place-items:center;padding:0;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:7px;
  cursor:pointer;transition:all .15s}
.ibtn:hover{color:var(--ink);border-color:var(--border-strong);background:var(--surface-hover)}
.ibtn svg{width:16px;height:16px;grid-area:1/1}
.ibtn{position:relative}
.ibtn::after{content:attr(data-tip);position:absolute;top:calc(100% + 9px);left:50%;
  transform:translateX(-50%) translateY(-4px);background:var(--ink);color:var(--surface);
  font-size:11px;line-height:1.4;white-space:nowrap;padding:5px 9px;border-radius:6px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:100}
.ibtn:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
html[data-theme="light"] .i-moon{display:none}
html[data-theme="dark"] .i-sun{display:none}

/* 头部说明 */
.intro {
  max-width: 1400px;
  margin: 0 auto;
  padding: 36px 28px 18px;
}
.intro h1 {
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 700;
  line-height: 1.25;
  margin: 0;
  letter-spacing: -0.5px;
}
.intro p {
  color: var(--muted);
  max-width: 720px;
  margin: 8px 0 0;
  font-size: 13.5px;
}
.intro .meta {
  font-size: 12px;
  color: var(--faint);
  margin-top: 10px;
}
.intro .meta b {
  color: var(--ink);
  font-weight: 600;
}

/* 搜索与筛选栏 */
.controls {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 28px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.search {
  max-width: 460px;
  position: relative;
}
.search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}
.search svg {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--faint);
}

.legend {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.lg {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.lg i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c);
}
.lg:hover {
  color: var(--ink);
  border-color: var(--border-strong);
}
.lg.on {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}

/* 树状图画布 */
.stage {
  max-width: 1400px;
  margin: 0 auto;
  padding: 8px 28px 80px;
  overflow-x: auto;
}
.tree {
  position: relative;
  min-width: 1220px;
  margin: 0 auto;
}
.wires {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}
.wires path {
  transition: opacity 0.2s, stroke-width 0.2s;
}
.divider-line {
  position: absolute;
  left: 200px;
  right: 20px;
  border-top: 1px dashed var(--border-strong);
  pointer-events: none;
}
.divider-label {
  position: absolute;
  right: 24px;
  transform: translateY(-50%);
  background: var(--bg);
  padding: 0 8px;
  font-size: 11px;
  color: var(--faint);
}

.node {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: opacity 0.2s, transform 0.15s, border-color 0.15s, background-color 0.15s;
}
.node.dim { opacity: 0.14; }

/* 根节点 */
.n-root {
  left: 8px;
  width: 152px;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--surface);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  box-shadow: var(--shadow);
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.n-root small {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.65;
}

/* 主干节点 */
.n-trunk {
  left: 210px;
  width: 184px;
  padding: 7px 11px;
  border-radius: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3.5px solid var(--c);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.n-trunk:hover, .n-trunk.active-path {
  border-color: var(--c);
  box-shadow: var(--shadow);
}
.n-trunk .badge-base {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--surface-hover);
  color: var(--muted);
}
.n-trunk .cnt {
  margin-left: auto;
  color: var(--faint);
  font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 400;
}
.n-trunk .fold {
  font-size: 11px;
  color: var(--faint);
  font-weight: 400;
  width: 12px;
  text-align: center;
}

/* 技能节点 */
.n-skill {
  left: 440px;
  width: 184px;
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}
.n-skill:hover, .n-skill.active-path {
  color: var(--ink);
  border-color: var(--c);
  background: var(--surface-hover);
}
.n-skill .fold {
  margin-left: auto;
  font-size: 11px;
  color: var(--faint);
}
.n-skill.empty {
  cursor: default;
  opacity: 0.45;
  border-style: dashed;
  background: transparent;
}
.n-skill.empty:hover {
  color: var(--muted);
  border-color: var(--border);
  background: transparent;
}

/* 资源叶子节点 */
.n-leaf {
  left: 672px;
  width: 520px;
  padding: 3px 8px 3px 4px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12.5px;
}
.n-leaf:hover {
  background: var(--surface);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}
.n-leaf .pip {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1.5px solid var(--c);
  display: grid;
  place-items: center;
  font-size: 9px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--c);
  background: var(--surface);
  transition: all 0.15s;
}
.n-leaf .txt {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink);
}
.n-leaf .kind {
  margin-left: auto;
  flex-shrink: 0;
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--surface-hover);
  color: var(--muted);
  border: 1px solid var(--border);
}
.n-leaf:hover .pip, .n-leaf.selected .pip {
  background: var(--c);
  color: #ffffff;
}
.n-leaf:hover .txt, .n-leaf.selected .txt {
  color: var(--c);
  font-weight: 600;
}
.n-leaf.hit .pip {
  background: var(--c);
  color: #ffffff;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c);
}
.n-leaf.faded { opacity: 0.18; }

/* 侧边详情抽屉 */
.drawer-mask {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(15, 23, 42, 0.25);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.drawer-mask.open {
  opacity: 1;
  pointer-events: auto;
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 90;
  width: min(480px, 94vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.breadcrumb {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.breadcrumb i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.close-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 16px;
}
.close-btn:hover {
  color: var(--ink);
  background: var(--surface-hover);
}
.drawer h2 {
  margin: 0;
  font-size: 18px;
  line-height: 1.4;
  font-weight: 700;
}
.drawer-desc {
  margin: 0;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.65;
  padding: 12px 14px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.drawer-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.drawer-tags span {
  font-size: 11.5px;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--surface-hover);
  color: var(--muted);
  border: 1px solid var(--border);
}
.drawer-meta {
  font-size: 12px;
  color: var(--faint);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* 抽屉正文：直接渲染资源 Markdown */
.drawer-body{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;background:var(--bg);font-size:13px;line-height:1.75}
.drawer-body h1,.drawer-body h2,.drawer-body h3{line-height:1.35;margin:1.2em 0 .5em;font-weight:650}
.drawer-body h1{font-size:19px;border-bottom:1px solid var(--border);padding-bottom:.3em}
.drawer-body h2{font-size:16px} .drawer-body h3{font-size:14px}
.drawer-body p{margin:.6em 0}
.drawer-body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.drawer-body code{background:var(--surface-hover);padding:1px 5px;border-radius:4px;font-size:.9em;font-family:ui-monospace,Consolas,monospace}
.drawer-body pre{background:var(--surface-hover);padding:11px 13px;border-radius:7px;overflow-x:auto;line-height:1.5}
.drawer-body pre code{background:transparent;padding:0}
.drawer-body blockquote{margin:.7em 0;padding:.3em .9em;border-left:3px solid var(--border-strong);color:var(--muted)}
.drawer-body table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:12px}
.drawer-body th,.drawer-body td{border:1px solid var(--border);padding:5px 7px;text-align:left}
.drawer-body ul,.drawer-body ol{padding-left:1.4em;margin:.5em 0}
.drawer-body hr{border:0;border-top:1px solid var(--border);margin:1em 0}
.drawer-actions {
  padding-top: 4px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
}
.primary-btn {
  flex: 1;
  text-align: center;
  background: var(--ink);
  color: var(--surface);
  padding: 10px 16px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  transition: opacity 0.15s;
}
.primary-btn:hover { opacity: 0.88; }

footer {
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--faint);
  font-size: 12px;
  padding: 20px;
}

@media (max-width: 760px) {
  .intro, .controls, .stage, .topin { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topin">

  </div>
</header>

<section class="intro">
  <h1>AI 技术栈与学习路径</h1>
  <p>从左侧根节点向右依次展开为<b>学习方向</b>、<b>具体技能</b>与<b>学习资源</b>。悬停资源可高亮所属完整路径，点击资源可查看详情与仓库原文链接。</p>
  <div class="meta">

</section>

<div class="controls">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>

    <input id="q" type="search" placeholder="搜索标题、关键词或标签，自动展开匹配路径…" autocomplete="off">

    <div id="nodes"></div>
  </div>
</div>

<!-- 右侧详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="breadcrumb" id="dPath"></div>
    <button class="close-btn" id="dClose" type="button" aria-label="关闭">×</button>
  </div>
  <h2 id="dTitle"></h2>
  <p class="drawer-desc" id="dDesc"></p>
  <div class="drawer-tags" id="dTags"></div>
  <div class="drawer-meta" id="dMeta"></div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-actions">
    <a class="primary-btn" id="dLink" href="#" target="_blank" rel="noopener">在 GitHub 中查看原文 ↗</a>
  </div>
</aside>

<footer>数据同步自仓库 build.py · 点击任意资源节点查看简介与路径归属</footer>

<script>/**

<script>
const TREE = {"root":"AI 技术栈","foundation":{"name":"基础层","skills":[{"name":"深度学习","items":[{"title":"Dive into Deep Learning","short":"Dive into Deep Learning","desc":"交互式深度学习教材，可执行 Jupyter Notebook，多框架实现（PyTorch/JAX/TF）","date":"2026-05-07","tags":["deep-learning","book","pytorch","jupyter","interactive","chinese"],"content":"\n> 交互式开源深度学习教材，代码+数学+图表+讨论一体化，可执行 Jupyter Notebook\n> 官网: https://d2l.ai · GitHub: https://github.com/d2l-ai/d2l-en\n\n## Overview\n\nDive into Deep Learning 是一本由 Amazon/CMU 研究者（Aston Zhang, Zack C. Lipton, Mu Li, Alex J. Smola）编写的交互式深度学习教材，剑桥大学出版社 2023 年出版。每一节都是可执行的 Jupyter Notebook，读者可修改代码即时查看结果。已被全球 70+ 国家 500+ 大学采用。\n\n## 核心特色\n\n- **真正交互式** — 每节都是可运行 Jupyter Notebook，修改代码即时反馈\n- **多框架实现** — PyTorch / NumPy+MXNet / JAX / TensorFlow\n- **从零实现+简洁实现** — 每个概念先从零构建，再用框架 API 简洁实现\n- **广度+深度** — 从基础到前沿（Transformer / BERT / ViT），含实战应用\n\n## 内容覆盖（23 章）\n\n| 模块 | 章节 |\n|------|------|\n| **基础** | 数据操作、线性代数、微积分、自动微分、概率 |\n| **线性模型** | 线性回归 & 分类（从零+简洁实现） |\n| **MLP** | 多层感知机、反向传播、Dropout、泛化 |\n| **工程实践** | 层、参数、初始化、GPU |\n| **CNN** | LeNet → AlexNet → VGG → GoogLeNet → ResNet → DenseNet |\n| **RNN** | LSTM / GRU / Encoder-Decoder / Seq2Seq / Beam Search |\n| **Attention & Transformer** | 自注意力 / 多头注意力 / Transformer / ViT / 大规模预训练 |\n| **优化** | SGD 变体 / Momentum / Adam / 学习率调度 |\n| **性能** | 多 GPU 训练 / 并行 / 参数服务器 |\n| **计算机视觉** | 数据增强 / 微调 / 目标检测(SSD, R-CNN) / 语义分割(FCN) / 风格迁移 |\n| **NLP** | word2vec / GloVe / BERT 预训练&微调 / 情感分析 / NLI |\n| **进阶** | 强化学习 / 高斯过程 / 超参优化 / GAN / 推荐系统 |\n\n---\n\n_Last updated: 2026-05-07_\n","path":"0-Resources/3-Tutorials/dive-into-deep-learning.md"},{"title":"强化学习直观理解 (VZstudio)","short":"强化学习直观理解 (VZstudio)","desc":"小鸡啄托盘得奖励——RL 直观体现，连接 RLHF 对齐","date":"2026-06-05","tags":["reinforcement-learning","rlhf","fine-tuning","pre-training","tutorial","video"],"content":"\n> 人移动托盘，小鸡啄正确的托盘就有奖励——强化学习的直观体现，连接 GPT/RHLF 对齐原理\n\n## 视频来源\n\n- **平台**：抖音 @VZstudio\n- **链接**：https://v.douyin.com/MAq8ABNWIeQ/\n\n## 视频核心演示\n\n> 人移动托盘（环境变化），小鸡自主决策啄向哪个托盘。啄对 → 给奖励（食物），啄错 → 没奖励。小鸡通过反复试错学会\"啄正确的托盘才能获得奖励\"——这就是强化学习的直观体现：智能体在环境中试错，依靠奖惩信号优化决策。\n\n## 延伸框架：学生学习三段论\n\n视频将 RL 训练流程类比为学生学习三阶段：\n\n| 阶段 | 类比 | AI 对应 |\n|------|------|---------|\n| **预训练** | 课堂灌输海量基础知识，模型记住通用规律 | 大模型 Pre-training（海量语料学习） |\n| **监督微调** | 给标准答案+标准解题步骤，照猫画虎 | Supervised Fine-Tuning (SFT) |\n| **强化学习** | 只评判对错不给答案，自主摸索更优解法 | RLHF / RL 对齐（PPO/GRPO） |\n\n## 强化学习本质\n\n- **不用固定标准答案束缚模型**，智能体在环境中不断试错探索\n- 依靠 **奖惩反馈** 优化决策策略，突破模仿学习的固化思维\n- 是 GPT 等大模型 **RLHF 对齐** 的核心原理\n\n## 与学习资源关联\n\n该视频的强化学习三阶段框架与以下资源互补：\n\n- [Build a Reasoning Model (From Scratch)](llms-from-scratch.md) — GRPO/推理时扩展的技术实现\n- [LLM 算法与工程学习路线](llm-algorithm-engineering-roadmap.md) — RLHF 在 LLM 训练流程中的位置\n\n_Last updated: 2026-06-05_\n","path":"0-Resources/3-Tutorials/rl-intuitive-explanation-vzstudio.md"}]},{"name":"系统与体系结构","items":[{"title":"10 门\"地狱级\"CS 公开课","short":"10 门\"地狱级\"CS 公开课","desc":"MIT/CMU/Stanford 顶尖 CS 系统课合集（数据库/分布式/OS/编译/AI系统）","date":"2026-04-21","tags":["course","systems","database","distributed-systems","os","compiler","deep-learning","tinyml"],"content":"\n> 全球顶尖 CS 公开课合集，覆盖数据库、分布式系统、操作系统、网络、编译、AI 系统等核心方向。\n> 来源：小红书帖子「💀 这10门课 被程序员称为\"地狱级\"」\n\n## Overview\n\n这 10 门课被中国程序员圈称为\"地狱级\"，多为 MIT、CMU、Stanford 等顶尖高校的本科必修课，特点是从零手写核心系统（数据库、OS、编译器、TCP 协议栈等），Lab 驱动，代码量大，学完后对底层理解质的飞跃。\n\n## 课程清单\n\n### 1. CMU 15-445 — 数据库系统\n- **老师**: Andy Pavlo（业内称号\"数据库摇滚明星\"）\n- **学什么**: 用 C++ 从零写一个完整的数据库 BusTub，亲手实现 Buffer Pool、B+ Tree、Hash Join、事务并发控制、日志恢复\n- **代码量**: 5000+ 行\n- **业界地位**: 阿里云/字节 ByteHouse/PingCAP 面试加分项\n- **官网**: https://15445.courses.cs.cmu.edu/\n\n### 2. MIT 6.824 (6.5840) — 分布式系统\n- **老师**: Robert Morris（Morris 蠕虫病毒作者，现 MIT 教授）\n- **学什么**: 用 Go 语言 4 个 Lab 逐步写 MapReduce、完整 Raft 共识算法（3000 行）、容错 KV 存储、分片 KV 数据库\n- **难点**: 处理网络分区 + 节点崩溃 + 消息丢失 + 消息乱序\n- **业界地位**: 字节/阿里/腾讯分布式岗敲门砖，做完能看懂 etcd 和 TiKV 源码\n- **官网**: https://pdos.csail.mit.edu/6.824/\n\n### 3. MIT 6.S081 (6.1810) — 操作系统\n- **学什么**: 亲手写一个操作系统，10 个 Lab 一步步改造 xv6 操作系统\n- **核心内容**: 进程调度、虚拟内存、文件系统、多线程\n- **学完效果**: 对\"程序怎么跑起来\"再无盲区\n- **官网**: https://pdos.csail.mit.edu/6.S081/2024/\n\n### 4. CMU 15-213 — CSAPP（深入理解计算机系统）\n- **定位**: 国内程序员圈神书《深入理解计算机系统》的官方课程\n- **9 个 Lab**:\n  - Bomb Lab — 用 GDB 逆向拆二进制炸弹\n  - Attack Lab — 写缓冲区溢出攻击\n  - Malloc Lab — 自己实现 malloc 和 free\n- **核心价值**: 打通\"代码 → 汇编 → CPU → 系统 → 网络\"完整链路\n- **官网**: https://www.cs.cmu.edu/~213/\n\n### 5. Stanford CS144 — 计算机网络\n- **学什么**: 从零写一个 TCP/IP 协议栈（C++）\n- **核心内容**: Socket 编程、完整 TCP 可靠传输（三次握手/拥塞控制/超时重传）、IP 路由、ARP 路由器\n- **学完效果**: \"TCP 三次握手\"面试题能讲 20 分钟不重样\n- **官网**: https://cs144.github.io/\n\n### 6. Stanford CS143 — 编译原理\n- **学什么**: 用 C++ 从零写一个编译器\n- **5 个 Project**: 词法分析 → 语法分析 → 语义分析 → 代码生成 → 优化\n- **学完效果**: 再看任何编程语言都不神秘，做低代码/规则引擎/DSL 降维打击\n- **官网**: https://web.stanford.edu/class/cs143/\n\n### 7. 南京大学 软件分析（Tai-e）\n- **老师**: 李樾 + 谭添（自研框架）\n- **定位**: 国内唯一能和 MIT/CMU 并肩的神课\n- **8 个作业**: 全中文讲解，配套 OJ\n- **学完效果**: 能做 CodeQL/SonarQube 这类工具，看穿任何代码的\"数据流 + 指针关系\"\n- **官网**: https://tai-e.pascal-lab.net/intro/overview.html\n\n### 8. CMU 10-414 — 深度学习系统\n- **老师**: 陈天奇（TVM/XGBoost/MXNet 作者）\n- **学什么**: 用 Python + CUDA 从零实现一个类 PyTorch 的深度学习框架\n- **核心内容**: 自动微分/张量运算/GPU kernel/反向传播/优化器/各种神经网络层\n- **学完效果**: 做 AI Infra/LLM 部署/推理加速含金量拉满\n- **官网**: https://dlsyscourse.org/\n\n### 9. MIT 6.5940 — TinyML（高效深度学习计算）\n- **老师**: 韩松（MIT 副教授 + NVIDIA 杰出科学家）\n- **代表作**: AWQ 量化算法、SmoothQuant W8A8 量化（vLLM/TensorRT-LLM 底层全在用）\n- **学什么**: LLM 量化/剪枝/蒸馏/推理加速，Lab 把 Llama2-7B 跑在笔记本上\n- **学完效果**: 知道\"INT4 量化为什么精度不掉\"，而不是当黑盒用\n- **官网**: https://efficientml.ai/\n\n### 10. UC Berkeley CS186 — 数据库（入门版）\n- **定位**: CMU 15-445 的前置友好版\n- **学什么**: 用 Java 实现数据库引擎 RookieDB\n- **特点**: 作业打磨极好，保姆级\n- **建议**: 觉得 15-445 太虐？先上这门热身\n- **官网**: https://cs186berkeley.net/\n\n## 难度 vs 业界含金量\n\n| 课程 | 难度 | 业界含金量 |\n|------|------|------------|\n| CMU 15-445 | ★★★★ | $$$ |\n| MIT 6.824 | ★★★ | $$$ |\n| MIT 6.S081 | ★★★★ | $$$$ |\n| CMU 15-213 CSAPP | ★★★★ | $$$$ |\n| Stanford CS144 | ★★★ | $$$ |\n| Stanford CS143 | ★★★★ | $$$ |\n| 南大 Tai-e | ★★ | $$$ |\n| CMU 10-414 | ★★ | $$$ |\n| MIT 6.5940 | ★★★★ | $$$$ |\n| UCB CS186 | ★★ | $$ |\n\n## 学习建议\n\n- **后端程序员**: 先啃 CMU 15-445，性价比最高，讲课最有意思\n- **AI 方向**: 先啃 MIT 6.5940 TinyML，直接对接工业界最前沿\n- **底层/内核方向**: CSAPP → 6.S081 → 6.824 三连，一年啃一门\n- **精学 3 门 >>> 浅学 30 门**\n- 视频不做 Lab 等于看武侠小说练武\n\n---\n\n_Last updated: 2026-04-21_\n","path":"0-Resources/3-Tutorials/top-10-hell-level-cs-courses.md"},{"title":"MIT 6.5840 (原 6.824) 分布式系统","short":"MIT 6.5840 分布式系统","desc":"MIT PDOS 研究生核心课：Raft/MapReduce/一致性，5 个硬核 Go lab","date":"2026-09-01","tags":["distributed-systems","go","mit","course"],"content":"\n> MIT CSAIL PDOS 组的分布式系统研究生核心课（现编号 6.5840，前身 6.824），Spring 2026 开课中。三大主线：**容错（fault tolerance）、复制（replication）、一致性（consistency）**，以经典分布式系统论文 case study + 5 个硬核 Go 编程 lab 闻名，是分布式训练/推理 infra 的系统课地基。\n\n## 课程概况\n\n- **性质**：研究生 12-unit 核心课，讲座 + 论文研读 + 编程 lab + 期中/期末\n- **先修**：计算机系统基础（6.1910/6.004）+ 系统工程课（6.1800/6.033 或 6.1810/xv6），需较强编程能力\n- **语言**：Go（所有 lab）\n- **社区**：Piazza 问答；历年站点（2000-2025）全公开，讲义/论文/quiz 自学友好\n- **注意**：Gradescope 提交仅限选课学生，自学走历年网站即可\n\n## 5 个 Lab（递进式，全部 Go）\n\n| Lab | 内容 | 核心能力 |\n|-----|------|----------|\n| Lab 1 | MapReduce | 分片、worker 调度、崩溃恢复、协调者容错 |\n| Lab 2 | KV Server（无 Raft） | 线性一致性（linearizability）、客户端会话、重复请求去重 |\n| Lab 3 | Raft | 领导者选举、日志复制、持久化、崩溃恢复 |\n| Lab 4 | KV Raft | 在 Raft 之上建 KV 服务（快照、日志压缩、去重） |\n| Lab 5 | Sharded KV | 分片控制 + 配置迁移（rebalancing），含 ShardKVs 的迁移与垃圾回收 |\n\n## 核心论文主题（典型讲次）\n\nGFS、MapReduce、primary/backup 复制、**Raft**（共识）、ZooKeeper、线性一致性与因果一致性、两阶段提交/分布式事务（Spanner、FaRM）、memcached/Redis 缓存、崩溃恢复（RRaft-Aries）、FLP 不可能性、容错虚拟机（FT-VM）等。2026 版 schedule 以站点为准：https://pdos.csail.mit.edu/6.824/schedule.html\n\n## 为什么放进 AI 学习路径\n\n- **分布式训练/推理的底层语义**：参数服务器、数据并行里的 collective、检查点恢复、容错调度，本质都是这课讲的问题（复制、一致性、故障恢复）\n- **vLLM/Ray/K8s 这类系统栈**：读完 Raft lab 再看 etcd/K8s 控制面会豁然开朗\n- **面试硬通货**：Raft 手写实现是国内大厂 infra 岗高频考点\n- 姊妹课 6.1810 (xv6) 打底 OS，本课向上接分布式；与「10 门地狱级 CS 公开课」条目里其它系统课互补\n\n## 学习建议\n\n1. 先修 xv6 或等价系统课基础（线程/RPC/锁）\n2. 按顺序做 lab，**Lab 3 (Raft) 是分水岭**——预留至少 2-3 周整块时间\n3. 每篇论文课前读 + 课后对照 lecture notes 补漏\n4. 自学者用历年网站（如 https://pdos.csail.mit.edu/6.824/2022/ 有完整视频）\n\n_Last updated: 2026-09-01_","path":"0-Resources/3-Tutorials/mit-65840-distributed-systems.md"}]},{"name":"AI Infra 全景","items":[{"title":"AI Infra 其实没有多少新东西","short":"AI Infra 其实没有多少新东西","desc":"腾讯云出品：硬件演进/PCA解耦/训练推理Infra，附PDF","date":"2026-06-06","tags":["ai-infra","gpu","training","inference","distributed-systems","hardware"],"content":"\n> 腾讯云开发者出品：传统后台工程师的技术栈如何迁移到 AI 系统，系统性拆解 AI Infra 的硬件、软件、训练和推理挑战\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **来源** | 腾讯云开发者（公众号） |\n| **时间** | 2026-06-05 |\n| **页数** | 27 页 |\n\n## 内容结构\n\n### 01 硬件演进\n\n| 对比维度 | 传统基础设施（CPU） | AI 基础设施（GPU） |\n|----------|-------------------|-------------------|\n| 计算模式 | 逻辑分支、整数运算 | 大规模稠密矩阵乘法（FP16/BF16） |\n| 瓶颈资源 | 网络 I/O、CPU 核心数 | 内存带宽（单机）、网络带宽（集群） |\n| 核心挑战 | \"访存墙\" | + \"通信墙\"（网络带宽比内存带宽低 3-4 个数量级） |\n| 扩展思维 | 无状态 + 负载均衡 | 模型并行/数据并行/流水线并行 |\n\n### 02 从\"去IOE\"到\"AI大型机\"\n\n- AI 集群呈现\"AI 大型机\"特性：专用硬件 + 专用网络，集中式架构\n- DeepSeek-R1 / QWen3-235B 千亿级参数需千卡集群\n- 传统分布式理念（横向扩展）在 AI 时代部分失效\n- 微秒级延迟等待也会造成巨大算力损耗\n\n### 03 PCA 架构解耦\n\n- **P** (Processing / 数据处理 / GPU 计算)\n- **C** (Control / 控制编排 / 调度框架)\n- **A** (Access / 访问接入 / 网关)\n\n将大型机式的耦合架构拆解为独立模块，明确各层次边界\n\n### 04 训练 Infra\n\n- 数据集管理：入库、清洗、标注、检验\n- 训练任务调度：资源分配、容错、监控\n- 模型 checkpoint 管理：存储、版本、回溯\n\n### 05 推理 Infra\n\n| 层次 | 内容 |\n|------|------|\n| 硬件层 | GPU / HBM / NVLink / RDMA |\n| 框架层 | vLLM / SGLang / TensorRT-LLM |\n| 调度层 | 弹性扩缩 / 智能路由 / 混部 |\n| 接入层 | 网关 / 鉴权 / 限流 / 负载均衡 |\n\n## 核心观点\n\n- **AI Infra 不是全新的领域**，传统后台工程积累的方法论（解耦、分层、容错、监控）大部分仍然适用\n- **核心差异在硬件**：GPU 主导的计算模式带来\"访存墙\"和\"通信墙\"两大工程挑战\n- **\"AI 大型机\"可能是阶段性的**，PCA 解耦是向更灵活架构演进的路径\n- **训练和推理是两类不同 workload**，需要不同的 Infra 设计\n\n## PDF 原文\n\n见本目录同名 PDF 文件。\n\n_Last updated: 2026-06-06_\n","path":"0-Resources/3-Tutorials/ai-infra-nothing-new.md"},{"title":"深入理解 AI Infra","short":"深入理解 AI Infra","desc":"李博杰开源书：数据搬移主线 + 量化估算方法论，12 章覆盖加速器/推理/训练/网络/调度","date":"2026-09-14","tags":["ai-infra","gpu","hardware","inference","training","distributed-systems","networking","scheduling","quantitative-analysis","book","chinese"],"content":"\n> 李博杰（bojieli）开源技术书，初稿持续修订中。全书 12 章，主线只有一条：**\"数据搬移塑造了 AI Infra 的架构\"**——反复追问五个问题：搬什么、搬多少、搬几次、经过哪里、谁必须等它。方法论是**从约束推导设计**：对照硬件容量、带宽、算力做量化估算。\n\n## 章节速览\n\n| 章 | 标题 | 核心问题 |\n|----|------|----------|\n| 1 | 初识 AI Infra | 一次生成需要多少显存、计算和数据读写？ |\n| 2 | 模型架构 | 注意力、历史状态与专家结构如何改变系统需求？ |\n| 3 | 推理与训练负载 | 任务阶段、到达模式和状态寿命如何影响资源需求？ |\n| 4 | 加速器架构 | 计算、存储、带宽、功耗与成本如何取舍？ |\n| 5 | 算子与运行时 | 融合、复用、并发和调度如何减少执行开销？ |\n| 6 | 超节点 | 多设备协作如何平衡容量、吞吐和同步代价？ |\n| 7 | 数据中心网络 | 带宽、通信方式和拥塞怎样影响计算效率？ |\n| 8 | 推理优化 | 批处理、KV 管理、卸载与推测解码何时有效？ |\n| 9 | 分布式推理 | 如何放置计算和状态，处理扩缩容与恢复？ |\n| 10 | 训练系统 | 怎样安排显存、通信和重算？ |\n| 11 | 资源调度与运行环境 | 模型服务和工具环境如何共享资源？ |\n| 12 | 端边云协同 | 任务放本地/边缘/云端，怎样兼顾效果、延迟和成本？ |\n\n## 关键论断\n\n- **\"模型成了 LLM 时代的操作系统，AI Infra 成了 LLM 时代的计算机体系结构\"**——类比 OS/体系结构的学习路径\n- 常见估算漏项：忘算 KV 缓存、忽略卡间通信——量化分析能兜住这些\n- 正文唯一维护源是仓库 `manuscripts/` 目录的 Markdown；PDF 版公式/表格排版更完整\n\n## 配套资源\n\n- 量化计算项目（可复算数值的计算工具与固定输入）\n- 按章节组织的配套实验与运行记录\n- [PDF 下载](https://github.com/bojieli/ai-infra-book/releases/latest/download/AI-Infra-Book.pdf)\n\n## 与既有资源的关系\n\n- 比 Ultra-Scale Playbook（训练并行专精）覆盖面更宽：推理/网络/调度/端边云都有\n- 与 JAX Scaling Book、Infra Seminars 2026 互补；第 4 章加速器架构直接衔接数字 IC 方向\n- 阅读顺序建议：前言 + 第 1 章打底（建立的模型/硬件/负载设定后面反复用）\n\n_Last updated: 2026-09-14_","path":"0-Resources/3-Tutorials/bojieli-ai-infra-book.md"},{"title":"AI Infra 大话西游 (Ringi)","short":"AI Infra 大话西游","desc":"大厂工程师 Ringi 的 AI Infra 全栈专栏：9 卷 44 讲 + 5 个 Capstone，三账本/算子/GPU 互联/分布式训练/推理/云原生","date":"2026-11-21","tags":["ai-infra","llm","gpu","cuda","distributed-training","inference","tutorial","chinese","book","kernel","serving","optimization"],"content":"\n> 作者 **Ringi Lee**（大厂 AI Infrastructure 工程师），副标题「从基础设施到智能未来的工程哲学与实战指南」。\n> **170★ / 24 forks**，Python，仓库创建于 2026-09-10、最后 push 2026-09-28（2026-11-21 核验）。\n> 定位是面向想进大厂 AI Infra / GPU 计算 / 大模型分布式训练与推理优化 / 云原生平台的工程师与架构师。\n\n## 规模与形态\n\n| 项 | 内容（README 口径） |\n|------|------|\n| 内容量 | 全书 **9 大分卷 · 44 篇万字核心讲义 + 5 大生产级 Capstone**，声明\"全套 49 篇已 100% 完结交付\" |\n| 学习时长 | 80 小时核心必修 + 12 小时选修扩展 + 5 大企业级实战 |\n| 文档形态 | **Mintlify** 交互式技术专著（Claude Docs 陶土色视觉 + 暗黑模式 + Diátaxis 架构），源码在 `docs/`，共 **62 篇 MDX**（口径与上面的 49 篇不一致，见注意事项） |\n| 配套资产 | 全景 8 层架构图 SVG、9 页企业级交付汇报 SVG + 可编辑 PPTX、封面图、LaTeX 公式规范、自动公式校验脚本 |\n| License | **README 未声明**，GitHub API 也未识别 SPDX；引用/转载前需向作者确认 |\n\n## 九卷大纲\n\n| 卷 | 讲数 | 关键内容 |\n|----|------|----------|\n| **一 · 性能工程与系统前置基石** | 11 | C++/Python 底层与 PyBind11、GEMM 算力账本、Cache Line/NUMA、perf/eBPF、PyTorch 内存布局与 Autograd 生命周期、CUDA Stream/CUDA Graph、Transformer 算子执行图、Collective 原语、三账本建模、Profiler 实战 |\n| **二 · GPU 硬件微架构与集群互联** | 10 | SM/Warp/Tensor Core/HBM3e + Roofline、Alpha-Beta 通信模型、PCIe/NVLink/NVSwitch/Fat-Tree/Rail、RDMA 与 GPUDirect、TMA/Copy Engine/mbarrier、GPU-Initiated RDMA、NCCL 拓扑切换、通信计算重叠、XID 掉卡与 NCCL Hang 诊断、异构算力选型 |\n| **三 · CUDA 编程与高性能算子优化** | 4 | CUDA 内存层次与合并访问、Reduce/Online Softmax/RMSNorm 融合、GEMM 六级优化与 Tensor Core、FlashAttention-1/2 与 Triton |\n| **四 · 大模型架构与显存精细建模** | 2 | MHA/MQA/GQA 演进、RoPE、SwiGLU；训练与推理四大显存账本、7B/70B 手算、KV Cache 容量模型 |\n| **五 · 大规模分布式训练系统** | 4 | DDP 梯度分桶与重叠、ZeRO-1/2/3 与 FSDP-2、TP/PP/SP/CP 的物理映射、Megatron 3D + MoE 专家并行与万卡排障 |\n| **六 · 在线推理系统与性能工程** | 5 | Prefill vs Decode 与 TTFT/TPOT、PagedAttention 与连续批处理、vLLM 的 Chunked Prefill/投机采样/前缀缓存、PD 分离、容量规划与 SLO 治理 |\n| **七 · 云原生 AI 平台与生产工程** | 4 | Container Toolkit / Device Plugin / DRA、Gang 调度 / Kueue / HAMi、Serving 高可用与 P99 契约、四级存储金字塔与百秒级自愈 |\n| **八 · Post-Training 与相邻 Infra** | 4 | SFT/LoRA/RLHF 资源评估（PPO/DPO/GRPO）、RAG 与 Agent 基础设施、NPU/DPU 异构抽象、大厂系统设计题库 |\n| **九 · 生产级 Capstone** | 5 | 见下表 |\n\n## 五大 Capstone\n\n| 项目 | 实战内容 |\n|------|----------|\n| 1. 万卡 Scaling Study | 手撕 64 卡跨机 18 倍网络断崖、DDP 梯度重叠临界点、FSDP 1.5 倍通信税，输出扩展性仿真报告 |\n| 2. Serving 吞吐倍增与 P99 治理 | 电商客服场景，实测 Chunked Prefill 重叠，声称吞吐翻倍、P99 延迟降 65%（作者自述，未独立复核） |\n| 3. 榨干片上 SRAM | Online Softmax 单趟递推证明、SRAM 分块与 Bank Conflict 消除、复现高保真 FlashAttention-2 核心内核 |\n| 4. 平台架构设计 RFC | RFC-AI-0045：Gang 调度、Kueue 弹性配额、HAMi 显存硬隔离、8×400G 双轨网络、XID 容灾自愈 |\n| 5. FlashAttention 全景与 Token 生成链路 | FA-1/2/3 微架构演进、FlashDecoding、Decode 阶段 GEMV 访存账本、PagedAttention 到 PD 分离全链路 |\n\n## 这个专栏的方法论\n\n- **三账本**：算力（Compute）/ 显存（Memory）/ 通信（Communication）三本账，遇到瓶颈先算账再谈优化。\n- **Ringi 工程师三问闭环 / No Naked Formula 2.0**：每篇必须回答 Shape 是什么、钱花在哪、机器上怎么跑、Evidence 在哪、Production 怎么选——不允许只堆名词或给简化版伪代码。\n- 配套 `python3 scripts/verify_latex_formulas.py` 做公式语法与 GitHub 渲染校验；`DESIGN.md`、`theme/`、`templates/` 是可复用的写作与视觉规范。\n\n## 学习路线\n\n- **初学者**：第一篇（系统前置）→ 第二篇（硬件微架构）→ 第三篇（CUDA 算子）→ 第四篇（显存建模）→ 第五/六篇（训练与推理系统）。\n- **资深架构师**：直奔第九篇的五个 Capstone，用万卡 Scaling、Serving 优化、SRAM 算子压榨与平台 RFC 检验全栈内功。\n\n## 与库内资源的分工\n\n| 资源 | 关系 |\n|------|------|\n| [深入理解 AI Infra](../3-Tutorials/bojieli-ai-infra-book.md) | 同类全景书，李博杰那本偏\"数据搬移主线 + 定量估算\"；这本从 C++/PyTorch 底层一路写到万卡平台与面试题库，工程粒度更细 |\n| [AI Infra 其实没有多少新东西](../3-Tutorials/ai-infra-nothing-new.md) | 先读这篇短文建立直觉，再进本专栏逐层算账 |\n| [Modern GPU Programming For MLSys](../3-Tutorials/mlc-modern-gpu-programming.md) | 与第三篇 CUDA/FlashAttention 章节互补：MLC 那门更偏 Blackwell 新硬件特性 |\n| [The Ultra-Scale Playbook](../3-Tutorials/ultrascale-playbook.md) | 与第五篇分布式训练重叠；Playbook 偏 HuggingFace/nanotron 实战，这里偏原理推导与通信账本 |\n| [大模型推理系统入门](../3-Tutorials/llm-inference-system-intro.md) / [zero-to-sglang](../3-Tutorials/zero-to-sglang.md) | 第六篇的 PagedAttention/PD 分离在这里讲系统账，后两者带你手搓实现 |\n| [AIPerf (NVIDIA)](../4-Tools-Frameworks/aiperf.md) | 第六篇容量规划与 SLO 治理的实测工具端 |\n\n## 注意点\n\n- ⚠️ 仓库约 **306 MB**（含 SVG/PPTX 等资产），`git clone` 建议加 `--depth 1`。\n- ⚠️ README 对篇数有两种说法：顶部\"49 篇（44 讲 + 5 Capstone）\"，文档预览处\"62 篇 MDX\"；后者可能计入了模板/规范类文件，引用时以原文两种口径为准。\n- ⚠️ **没有公开在线站点**：只提供本地 Mintlify 预览（`npm run dev` 或 `npx mintlify dev --dir docs --port 3001`，访问 `http://localhost:3001`），需要先 clone。\n- License 未声明，GitHub 也未识别 SPDX，商用/转载前先问作者。\n\n## 个人备注\n\n库里已有的 AI Infra 全景资源都是\"讲清一条主线\"，这本是少见的**把 44 讲按工程师成长顺序串成必修课**的写法：每讲都在回答\"机器上到底怎么跑\"，还配了五大 Capstone 和面试题库。第五篇的通信账本、第七篇的云原生调度正好补上我之前只零散看过的部分；先把第一篇和第二篇过一遍建立账本直觉，再按当前工作挑第五/六篇深读。\n\n_Last updated: 2026-11-21_\n","path":"0-Resources/3-Tutorials/ai-infra-odyssey.md"}]},{"name":"路线与索引","items":[{"title":"LLM 算法与工程学习路线","short":"LLM 算法与工程学习路线","desc":"从算法/分布式训练/推理部署/评估的完整路线，含优先级分层","date":"2026-04-21","tags":["llm","training","distributed-training","inference","algorithm","engineering","roadmap"],"content":"\n> 从算法原理到分布式训练到推理部署的完整路线，按优先级分层：🔥 必做 → 🔍 深入 → 💡 了解\n\n## 一、LLM 算法基础\n\n### 1.1 Tokenizer 原理 🔥\n- 手写 BPE 合并过程（小语料用 Python）\n- 搞懂 sentencepiece / tiktoken + `<unk>` `<eos>` `<pad>` 设计\n- **补充**：理解 Byte-level BPE 为何取代 char-level（OOV 问题根源）\n\n### 1.2 后训练算法 🔥\n- **SFT**：数据质量 > 数量，chat template 设计\n- **DPO**：理解 preference pair → implicit reward → policy gradient 等价\n- **GRPO / RLHF (PPO)**：GRPO 无需 value model，PPO 更稳定但工程更重\n- **补充**：ORPO / SimPO 等新变体了解即可，核心是 DPO + GRPO\n\n### 1.3 模型架构演进 🔍\n- 归一化位置：Pre-LN (LLaMA) vs Post-LN (GPT-2)\n- 激活函数：SwiGLU vs GELU\n- 位置编码：RoPE vs ALiBi vs RoPE scaling\n- 注意力改进：GQA (LLaMA-2) → MQA → MLA (DeepSeek)\n- MoE 架构：DeepSeek-V3 / Mixtral 的路由与负载均衡\n- **建议**：不要逐个学，对比着看差异更清晰\n\n### 1.4 Scaling Laws 💡\n- Chinchilla 定律：模型参数量 vs 数据量的最优比例\n- 为什么 7B 模型用 2T token 训练是欠训练\n- **实用价值**：帮你决定\"该训多大模型配多少数据\"\n\n### 1.5 上下文长度扩展 🔍\n- RoPE scaling（NTK-aware / YaRN / Dynamic NTK）\n- 训练短序列 → 推理长序列的策略\n- 注意力机制的长序列瓶颈与解决思路\n\n---\n\n## 二、分布式训练\n\n### 2.1 数据并行 🔥\n- **DDP**：all-reduce 原理 + torch profiler 看通信耗时\n- **FSDP**：分片参数/梯度/优化器状态，对比 DDP 显存（省 50%+）\n  - `auto_wrap_policy` + `cpu_offload` 配置\n  - FSDP vs ZeRO-1/2/3 对应关系\n\n### 2.2 模型并行 🔍\n- **TP（张量并行）**：行切/列切权重矩阵，通信量 = 2×batch×hidden\n- **PP（流水线并行）**：1F1B 微批次调度，bubble 率优化\n- **EP（专家并行）**：MoE 模型的专家分布策略\n- 跑通 Megatron / DeepSpeed TP+PP 示例\n\n### 2.3 显存优化 🔥\n- **能预估显存占比**（这是基本功）\n  - 模型参数 × 2 (FP16) + 优化器状态 × 2 (momentum+variance) + 梯度 × 1 + 激活 × N\n- 激活重计算（selective recomputation 策略）\n- 混合精度：FP16 需 loss scaling，BF16 无脑用\n- 梯度累积（模拟超大 batch）\n\n### 2.4 训练稳定性 🔥\n- DeepSpeed ZeRO-3 配置（offload 选项）\n- 训练 7B 模型（单机 8 卡试起来）\n- 梯度范数监控 ｜ NaN 自动跳过 ｜ `detect_anomaly`\n- **补充**：NCCL 超时 / OOM 排查是工程必修课\n\n---\n\n## 三、工程实践\n\n### 3.1 Data Pipeline 🔥\n- JSONL → Dataset 类 → DataLoader\n- 数据配比（WeightedRandomSampler）\n- 换数据配比 → 观察下游指标\n- **补充**：数据去重（MinHash）和质量过滤（perplexity filter）比配比更重要\n\n### 3.2 训练 + 评估 🔥\n- 每个 step 输出 loss，每个 epoch 算 perplexity\n- NaN 检测：跳过 batch / 降低 LR / 保存现场\n- `torch.cuda.amp` 捕获溢出警告\n- **补充**：eval loss 比 train loss 更重要，过拟合的信号在 eval 上\n\n### 3.3 保存 / 加载 / 断点续训 🔥\n- checkpoint 必须存：model、optimizer、scheduler、seed、step\n- 从任意 step 恢复，loss 一致\n- **补充**：自动保留最近 N 个 + 最优 checkpoint，磁盘不够别全存\n\n### 3.4 超参调优 🔍\n- 前期剧烈震荡 → 降 LR + 加长 warmup + 提 batch size\n- Loss spike → 数据异常 / 梯度裁剪失效 / LR 过大\n- 不同阶段 LR 经验：预训练 (1e-4~3e-4)、SFT (1e-5~5e-5)、DPO (5e-7~1e-6)、GRPO (1e-6)\n- **LR 是最关键的超参，没有之一**\n\n---\n\n## 四、推理与部署\n\n> **这块原清单完全缺失，但对工程落地最关键**\n\n### 4.1 推理基础 🔥\n- KV Cache 原理：为什么自回归推理的瓶颈是显存不是算力\n- Prefill vs Decode 阶段差异（compute-bound vs memory-bound）\n- Continuous Batching / PagedAttention（vLLM 核心思想）\n\n### 4.2 量化 🔥\n- W8A8 / W4A16 / GPTQ / AWQ / GGUF 区别与选择\n- 何时用量化：7B→4bit 可在 8GB 显卡跑\n- 和训练阶段 TinyML 6.5940 的量化知识打通\n\n### 4.3 推理框架 🔍\n- vLLM / TensorRT-LLM / SGLang 选型\n- Speculative Decoding（小模型猜 + 大模型验）\n- **实践**：用 vLLM 部署一个 7B 模型，测吞吐和延迟\n\n### 4.4 服务化 💡\n- OpenAI-compatible API 封装\n- 多卡 tensor parallel 推理\n- 流式输出 SSE 实现\n\n---\n\n## 五、评估体系\n\n> **原清单缺失：训完怎么评测？**\n\n### 5.1 基础评估 🔥\n- 通用能力：MMLU / C-Eval / CMMLU\n- 数学推理：GSM8K / MATH\n- 代码：HumanEval / MBPP\n- 长文本：Needle-in-a-Haystack / LongBench\n\n### 5.2 对齐评估 🔍\n- MT-Bench / AlpacaEval（指令遵循）\n- 安全性评估：红队测试 / harmful prompt 拒绝率\n\n### 5.3 评估实践 💡\n- lm-evaluation-harness 使用\n- 自建评测集：覆盖你的业务场景\n- **关键**：eval 分数和真实体感经常不一致，人工抽检不可省\n\n---\n\n## 六、性能分析（进阶）\n\n### 6.1 GPU Profiling 🔍\n- 用 Nsight Systems 分析 Transformer block 瓶颈（gemm / softmax / all-reduce）\n- torch.profiler + TensorBoard 可视化\n\n### 6.2 算子优化 💡\n- FlashAttention-2：对训练稳定性和速度的影响\n- 读 FlashAttention-2 CUDA / Triton 代码\n- 算子融合（kernel fusion）减少显存访问\n\n---\n\n## 优先级总结\n\n| 阶段 | 必做 🔥 | 推荐 🔍 | 了解 💡 |\n|------|---------|---------|---------|\n| 算法 | Tokenizer, SFT/DPO/GRPO | 架构演进, 长上下文 | Scaling Laws |\n| 训练 | DDP/FSDP, 显存预估, 稳定性 | TP/PP, 超参调优 | NCCL 排查 |\n| 工程 | Data Pipeline, 评估, 断点续训 | 数据去重/过滤 | 自动 checkpoint 管理 |\n| 推理 | KV Cache, 量化 | vLLM 部署 | Speculative Decoding |\n| 评测 | MMLU/GSM8K | MT-Bench | 自建评测集 |\n\n---\n\n_Last updated: 2026-04-21_\n","path":"0-Resources/3-Tutorials/llm-algorithm-engineering-roadmap.md"},{"title":"猛猿大模型技术文章导航","short":"猛猿大模型技术文章导航","desc":"知乎猛猿图解 LLM 系列总索引：训练并行/微调/RLHF/推理加速/扩散/多模态","date":"2026-07-07","tags":["llm","distributed-training","inference","rlhf","multimodal","transformer","blog","chinese"],"content":"\n> 知乎答主「猛猿」的图文并茂（图解）大模型技术文章合集总目录。覆盖训练并行、微调、RLHF、推理加速、扩散模型、多模态、Transformer 系列，质量高、图示清晰，是中文社区最系统的 LLM 工程/原理学习素材之一。\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **作者** | 猛猿（知乎专栏「前面de算法」） |\n| **类型** | 技术博客文章索引（持续更新） |\n| **特点** | 图解为主，原理 + 源码解读双线，适合工程向深度学习 |\n| **编辑时间** | 2026-01-15（仍在更新） |\n| **总入口** | https://zhuanlan.zhihu.com/p/654910335 |\n\n## 核心要点（摘要）\n\n这是一份**导航型索引**，本身不是单篇教程，而是把作者全部历史文章按系列归类，方便系统性地按顺序阅读。对想构建「从训练到推理」完整 LLM 知识体系的读者尤其有用——每个系列都从原理讲起，再落地到源码（Megatron / DeepSpeed / vLLM 等）。\n\n## 系列目录\n\n### 大模型训练系列（并行 / ZeRO / Megatron / MoE / 序列并行）\n\n- [图解流水线并行（Pipeline Parallelism, Gpipe)](https://zhuanlan.zhihu.com/p/613196255)\n- [图解数据并行上篇（DP, DDP 与 ZeRO）](https://zhuanlan.zhihu.com/p/617133971)\n- [图解数据并行下篇（ZeRO，零冗余优化）](https://zhuanlan.zhihu.com/p/618865052)\n- [图解张量模型并行（Megatron-LM）](https://zhuanlan.zhihu.com/p/622212228)\n- [Megatron 源码解读 1：分布式环境初始化](https://zhuanlan.zhihu.com/p/629121480)\n- [Megatron 源码解读 2：模型并行](https://zhuanlan.zhihu.com/p/634377071)\n- [Megatron 源码解读 3：分布式混合精度训练](https://zhuanlan.zhihu.com/p/662700424)\n- [DeepSpeed-Megatron MoE 并行训练（原理篇）](https://zhuanlan.zhihu.com/p/681154742)\n- [DeepSpeed-Megatron MoE 并行训练（源码解读篇）](https://zhuanlan.zhihu.com/p/681692152)\n- [序列并行 1：Megatron SP](https://zhuanlan.zhihu.com/p/4083427292)\n- [序列并行 2：DeepSpeed Ulysses](https://zhuanlan.zhihu.com/p/4496065391)\n- [序列并行 3：Ring Attention](https://zhuanlan.zhihu.com/p/4963530231)\n- [序列并行 4：Megatron Context Parallel](https://zhuanlan.zhihu.com/p/5502876106)\n- [图解 Megatron TP 中的计算通信 overlap](https://zhuanlan.zhihu.com/p/16594218518)\n- [探索一个关于 DeepSpeed ZeRO3 的认知误区](https://zhuanlan.zhihu.com/p/20115278338)\n\n### 大模型微调系列\n\n- [图解 LoRA（原理篇）](https://zhuanlan.zhihu.com/p/646831196)\n- [图解 LoRA（源码解读与实操篇）](https://zhuanlan.zhihu.com/p/654897296)\n- [AdaLoRA：能做\"财务\"预算的低秩适配器](https://zhuanlan.zhihu.com/p/657130029)\n\n### RLHF 系列\n\n- [人人都能看懂的 PPO 原理与源码解读](https://zhuanlan.zhihu.com/p/677607581)\n- [人人都能看懂的 RLHF-PPO 理论知识](https://zhuanlan.zhihu.com/p/7461863937)\n- [图解 OpenRLHF 中基于 Ray 的分布式训练流程](https://zhuanlan.zhihu.com/p/12871616401)\n- [人人都能看懂的 DPO 数学原理](https://zhuanlan.zhihu.com/p/721073733)\n- [OpenAI o1 技术初探 1：整体框架，Test-Time Scaling Law](https://zhuanlan.zhihu.com/p/773907223)\n- [OpenAI o1 技术初探 2：使用 MCTS 增强推理能力](https://zhuanlan.zhihu.com/p/864190605)\n- [OpenAI o1 技术初探 3：让模型拥有自我纠错能力](https://zhuanlan.zhihu.com/p/905620136)\n- [记录对 DeepSeek-R1 的一些理解](https://zhuanlan.zhihu.com/p/19843230707)\n- [强化学习解析一：MDP 和有模型学习](https://zhuanlan.zhihu.com/p/607596944)\n\n### 大模型推理 / 计算加速系列\n\n- [FlashAttention V1：从硬件到计算逻辑](https://zhuanlan.zhihu.com/p/669926191)\n- [Flash Attention V2：从原理到并行计算](https://zhuanlan.zhihu.com/p/691067658)\n- [Mixtral 8×7B 推理优化原理与源码实现](https://zhuanlan.zhihu.com/p/691066049)\n- [vLLM 核心技术 PagedAttention 原理](https://zhuanlan.zhihu.com/p/691038809)\n- [vLLM 源码解析 1：整体架构](https://zhuanlan.zhihu.com/p/691045737)\n- [vLLM 源码解析 2：调度器策略（Scheduler）](https://zhuanlan.zhihu.com/p/692540949)\n- [vLLM 源码解析 3：块管理器 BlockManager（上篇）](https://zhuanlan.zhihu.com/p/700780161)\n- [vLLM 源码解析 3：Prefix Caching（BlockManager 下篇）](https://zhuanlan.zhihu.com/p/707228704)\n- [从啥也不会到 CUDA GEMM 优化](https://zhuanlan.zhihu.com/p/703256080)\n- [分离式推理架构 1：从 DistServe 谈起](https://zhuanlan.zhihu.com/p/706761664)\n- [分离式推理架构 2：chunked-prefills](https://zhuanlan.zhihu.com/p/710165390)\n- [再读 MLA，还有多少细节是你不知道的](https://zhuanlan.zhihu.com/p/19585986234)\n- [图解 vLLM V1 系列 1-7：整体流程 / Executor-Workers / KV Cache 初始化 / 加载权重 / 调度器 / KVCacheManager / AsyncLLM](https://zhuanlan.zhihu.com/p/1900126076279160869)\n\n### 扩散模型系列\n\n- [DDPM（模型架构篇）](https://zhuanlan.zhihu.com/p/637815071)\n- [DDPM（数学原理篇）](https://zhuanlan.zhihu.com/p/650394311)\n- [DDPM（源码解读篇）](https://zhuanlan.zhihu.com/p/655568910)\n\n### CV 大模型与多模态系列\n\n- [再读 ViT，还有多少细节是你不知道的](https://zhuanlan.zhihu.com/p/657666107)\n- [关于 CLIP，还有哪些细节是你不知道的](https://zhuanlan.zhihu.com/p/660476765)\n- [再读 GAN：博弈理论下的一个实例](https://zhuanlan.zhihu.com/p/663253709)\n- [再读 Swin Transformer](https://zhuanlan.zhihu.com/p/663747861)\n- [再读 Deformable DETR](https://zhuanlan.zhihu.com/p/700776674)\n- [万字长文图解 Qwen2.5-VL 实现细节](https://zhuanlan.zhihu.com/p/1921289925552210138)\n\n### ChatGPT 技术解析系列\n\n- [训练框架 InstructGPT](https://zhuanlan.zhihu.com/p/605516116)\n- [GPT1、GPT2 与 GPT3](https://zhuanlan.zhihu.com/p/609367098)\n- [赋予 GPT 写代码能力的 Codex](https://zhuanlan.zhihu.com/p/611313567)\n\n### Transformer 系列\n\n- [Positional Encoding（位置编码）](https://zhuanlan.zhihu.com/p/454482273)\n- [避开复数推导理解 RoPE](https://zhuanlan.zhihu.com/p/863378538)\n- [Self-Attention（自注意力机制）](https://zhuanlan.zhihu.com/p/455399791)\n- [为什么 Transformer 要用 LayerNorm](https://zhuanlan.zhihu.com/p/456863215)\n- [ResNet（残差网络）](https://zhuanlan.zhihu.com/p/459065530)\n- [BERT 学习笔记一：基于论文精读的模型详解](https://zhuanlan.zhihu.com/p/461267517)\n\n### 其他（大数据 / Git）\n\n- [Hadoop 学习笔记：图解 HDFS 文件系统](https://zhuanlan.zhihu.com/p/459921566)\n- [如何理解 git 的快照](https://www.zhihu.com/question/27680108/answer/2300327037)\n- [git rebase 和 merge 的具体分别](https://www.zhihu.com/question/26492099/answer/2300416608)\n\n## 与现有资源关联\n\n- [大模型推理系统入门](llm-inference-system-intro.md) — 宏观推理优化视角，本文索引中的 vLLM / PagedAttention / FlashAttention 系列是其原理溯源\n- [AI Infra 其实没有多少新东西](ai-infra-nothing-new.md) — 训练/推理 Infra 全局视角，与本文的并行训练、分离式推理系列互补\n- [Modern GPU Programming For MLSys](mlc-modern-gpu-programming.md) — 本文「CUDA GEMM 优化」「FlashAttention」系列的底层硬件延伸\n- [LLM 算法与工程学习路线](llm-algorithm-engineering-roadmap.md) — 本文索引可作为该路线的「图解版配套阅读材料」\n\n## 个人备注\n\n猛猿的图解系列是中文社区质量 top 级的 LLM 原理/工程素材，尤其适合作为：\n1. **分布式训练**系统学习的图解入口（DP/DDP/ZeRO → TP/PP → SP/MoE）；\n2. **推理加速**源码级溯源（vLLM 全系列、FlashAttention、分离式架构）；\n3. **RLHF/o1/DeepSeek-R1** 对齐与推理时扩展的直觉建立。\n\n与毕设 GEMM/Attention Kernel 优化方向、以及 AI Infra 到 IC 交叉方向高度相关。计划按「训练 → 推理 → RLHF」顺序精读，作为现有英文教材（CS336、JAX Scaling Book）的中文图解补充。\n\n_Last updated: 2026-07-07_\n","path":"0-Resources/3-Tutorials/mengyuan-llm-articles-index.md"},{"title":"Sebastian Raschka Blog","short":"Sebastian Raschka Blog","desc":"深度学习、LLM、PyTorch 技术博客","date":"2026-04-04","tags":["blog","deep-learning","llm","pytorch"],"content":"\n## 核心要点（摘要）\n\nSebastian Raschka 博士的博客，发布深度学习、LLM、PyTorch 相关的技术文章和教程。内容涵盖模型实现细节、研究论文解读、实践技巧。\n\n## 主要内容\n\n- **LLM from Scratch** — 从零构建大语言模型的系列文章，配套书籍\n- **PyTorch 深度学习** — 大量 PyTorch 实现教程，覆盖 CNN、RNN、Transformer 等\n- **AI 研究论文解读** — 对最新论文的技术分析\n- **实践技巧** — 训练优化、模型调参、工程落地经验\n\n## 个人备注\n\n博客文章质量高，适合作为学习深度学习和 LLM 原理的辅助资料。代码实现细节丰富，对理解模型内部机制很有帮助。\n\n_Last updated: 2026-04-04_\n","path":"0-Resources/3-Tutorials/sebastian-raschka-blog.md"}]}]},"branches":[{"name":"LLM 原理","skills":[{"name":"从零构建 LLM","items":[{"title":"Build a LLM (From Scratch)","short":"Build a LLM (From Scratch)","desc":"Sebastian Raschka 著，从零构建 ChatGPT 级 LLM（92k+ Stars）","date":"2026-05-07","tags":["llm","from-scratch","pytorch","gpt","fine-tuning","lora","book"],"content":"\n> Sebastian Raschka 著，从零构建 ChatGPT 级 LLM 的完整指南\n> GitHub: https://github.com/rasbt/LLMs-from-scratch（92k+ Stars）\n\n## Overview\n\nManning 2024 年出版的 *Build a Large Language Model (From Scratch)* 官方代码仓库。全书用 PyTorch 从零实现一个类 ChatGPT 的 LLM，不依赖任何外部 LLM 库，每一步都可理解、可修改、可运行。\n\n## 内容覆盖\n\n| 章节 | 主题 |\n|------|------|\n| Ch 1 | 理解大语言模型 |\n| Ch 2 | 文本数据处理（tokenization / dataloader / BPE） |\n| Ch 3 | 编码注意力机制（Multi-Head Attention） |\n| Ch 4 | 从零实现 GPT 模型 |\n| Ch 5 | 无标签数据预训练（训练循环 / 权重加载） |\n| Ch 6 | 文本分类微调 |\n| Ch 7 | 指令跟随微调 |\n| App A | PyTorch 入门 |\n| App D | 训练循环增强技巧 |\n| App E | LoRA 参数高效微调 |\n\n## 扩展内容\n\n- **其他 LLM 架构从零实现**：Llama 3.2 / Qwen3 / Gemma 3 / Olmo 3 / Tiny Aya / Qwen3.5 / Gemma 4\n- **注意力变体**：Grouped-Query Attention / Multi-Head Latent Attention / Sliding Window Attention / Gated DeltaNet\n- **MoE / KV Cache / FLOPs 分析 / DPO 对齐**\n- **BPE Tokenizer 从零实现**\n- 配套 17 小时视频课程 + 170 页 Quiz PDF\n\n## 适合谁\n\n- 有 Python 基础，想从代码层面理解 LLM 内部机制\n- PyTorch 经验非必需但有帮助\n- CPU 即可运行大部分代码，GPU 加速更快\n\n---\n\n_Last updated: 2026-05-07_\n","path":"0-Resources/3-Tutorials/llms-from-scratch.md"},{"title":"Diy-LLM (Datawhale)","short":"Diy-LLM (Datawhale)","desc":"CS336 中文本土化实现课：16 章理论 + 6 个渐进代码作业，从手搓 tokenizer 到 GRPO","date":"2026-10-30","tags":["cs336","llm","from-scratch","datawhale","chinese","tokenizer","moe","cuda","kernel","distributed-training","inference","alignment","grpo","course"],"content":"\n> 斯坦福 **CS336 (Spring 2026)** 的中文本土化实现课程，2302★。自我定位不是\"汉化版\"，而是\"**LLM 炼丹工坊**\"——16 章硬核理论 + **6 个渐进代码作业**，代码驱动、每行实现都讲思考过程；额外做了国内环境适配（Qwen/DeepSeek 案例、算力现实）。中文文档为默认，另有 `docs/en/` 英文版与 PDF 讲义。\n\n## 16 章结构\n\n| 章 | 关键内容 | 配套作业 |\n|----|----------|----------|\n| 1 | 工具使用：W&B 实验追踪、超参搜索、可视化面板 | — |\n| 2 | 分词器：BPE 原理、Unicode 规范化、**手写 tokenizer 训练代码** | 作业 1 |\n| 3 | PyTorch 与资源核算：混合精度、梯度累积、FLOPs/显存估算 | — |\n| 4 | LM 架构与训练细节：RoPE、RMSNorm、SwiGLU、AdamW、Pre/Post-Norm、学习率调度 | 作业 1 |\n| 5 | 混合专家模型：Top-K 路由、负载均衡、辅助损失、Expert Parallelism、DeepSeekMoE | — |\n| 6 | GPU 与优化：显存带宽/计算强度、Flash Attention、Kernel Fusion、BF16/TF32 | 作业 2 |\n| 7 | GPU 高性能编程：CUDA 编程模型、Tensor Cores、Shared Memory、**Triton 入门** | 作业 2 |\n| 8 | 分布式训练：DP/MP/PP、ZeRO-1/2/3、FSDP、All-Reduce | 作业 2 |\n| 9 | Scaling Laws：Chinchilla 定律、计算最优配置、外推 | 作业 3 |\n| 10 | 推理：KV Cache、投机解码、量化（GPTQ/AWQ）、PagedAttention、Continuous Batching | 作业 6 |\n| 11 | 数据工程：质量过滤、MinHash 去重、PII 脱敏、数据配比、Data Curriculum | 作业 4 |\n| 12 | 评估与基准：MMLU、HumanEval、HELM、CEval、AlpacaEval、Arena 排名 | 作业 6 |\n| 13 | 训练流程：Pre-training、SFT、DPO、RLHF PPO、Alignment Tax | 作业 5 |\n| 14 | 可验证奖励的 RL：GRPO、Rule-based Verifier、Outcome/Process Reward、RLVR 与 R1 方案 | 作业 5 |\n| 15 | 多模态：CLIP/SigLIP → LLaVA → Qwen-VL → Chameleon 到 Omni Model | — |\n| 16 | 扩展内容：LLM 推理与未来（更新中） | — |\n\n## 6 个渐进作业\n\n| 作业 | 主题 |\n|------|------|\n| assignment1-basics | 手搓大模型（tokenizer + 架构 + 训练） |\n| assignment2-systems | 系统优化（GPU 优化 + 分布式训练） |\n| assignment3-scaling | 扩展定律实验 |\n| assignment4-data | 预训练数据处理 |\n| assignment5-alignment | 对齐（SFT/DPO/RLHF/GRPO） |\n| assignment6-evaluation | 评估与推理优化 |\n\n## 与库内「CS336 中文读本」的分工\n\n库里已有 `cs336-language-modeling-from-scratch.md`（高飞的电子替身改编），两者是**同一门课的两条路线**：\n\n| 维度 | 已有：CS336 中文读本 | 本条目：Diy-LLM |\n|------|---------------------|-----------------|\n| 出品 | 个人改编 | **Datawhale 团队**（徐虎/李盛康/黎又榛等，含审核流程） |\n| 定位 | 面向高中生的**通识读本**（降门槛、阅读向） | 面向能写 PyTorch 者的**工程实现课**（代码驱动） |\n| 作业 | 无 | **6 个渐进作业**（含手写 tokenizer、CUDA/Triton、ZeRO/FSDP） |\n| 章节 | 17 讲通识化改写 | 16 章 + 作业，覆盖更细（MoE/分布式/数据工程/RLVR） |\n| 适合场景 | 先建立全景认知 | 之后动手真做一遍 |\n\n**建议路径**：先读读本建立地图 → 再用 Diy-LLM 动手（尤其作业 1/2，直接对应 CUDA + 分布式训练主线）。\n\n## 前置要求与注意\n\n- 前置：熟练 Python、PyTorch、线代/概率/微积分（CUDA 基础可选，课内有入门）\n- 无 GPU 也能学理论，完整训练需 GPU（建议云平台）\n- ⚠️ 仓库体积约 **200MB**（含 PDF/图片），`git clone` 慢；只要文档可加 `--depth 1`\n- License：README 声明 **CC BY-NC-SA 4.0**（GitHub SPDX 未自动识别，引用前以 README/LICENSE 原文为准）\n- 在线阅读：https://datawhalechina.github.io/diy-llm/ ；PDF 讲义在 Releases\n\n_Last updated: 2026-10-30_","path":"0-Resources/3-Tutorials/datawhale-diy-llm.md"}]},{"name":"中文通识","items":[{"title":"CS336 从零构建语言模型 (中文)","short":"CS336 中文通读本","desc":"斯坦福 CS336 全17讲中文通识读本：分词→预训练→对齐","date":"2026-06-28","tags":["cs336","llm","from-scratch","tokenizer","pre-training","alignment","chinese","open-access","course"],"content":"\n> 斯坦福 CS336 (Spring 2026, Percy Liang/Tatsunori Hashimoto) 全17讲改写为面向高中生的通识中文读本，完整、准确、保留全部专业术语。\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **原著** | Stanford CS336 Language Modeling from Scratch (Spring 2026) |\n| **讲师** | Percy Liang · Tatsunori Hashimoto |\n| **改编** | 高飞的电子替身（微信 rohanjojo） |\n| **许可** | CC BY-NC-SA 4.0 |\n| **阅读方式** | HTML 在线 / PDF 下载 |\n| **字数** | 约 8 万字 |\n| **插图** | 20+ 原创示意图 |\n| **GitHub** | [feigaobox10/llm-from-scratch-reader](https://github.com/feigaobox10/llm-from-scratch-reader) |\n| **课程官网** | [cs336.stanford.edu](https://cs336.stanford.edu/) |\n| **YouTube 课程视频** | [完整播放列表](https://www.youtube.com/playlist?list=PLoROMvodv4rMqXOcazWaTUHhq-yembLCV) |\n\n## 内容覆盖\n\n| 模块 | 章节 |\n|------|------|\n| **分词 (Tokenizer)** | Byte-Pair Encoding、SentencePiece、Unigram 等分词算法原理与实现 |\n| **架构** | Transformer、Attention Mechanism、Positional Encoding |\n| **预训练** | 数据准备、训练目标、训练策略、损失函数 |\n| **对齐** | RLHF、DPO、Instruction Tuning、RLVR 等对齐方法 |\n| **评估** | 语言模型评估方法论、Benchmark |\n| **系统优化** | GPU/TPU 编程、Triton Kernel、并行策略（TP/PP/DP） |\n| **数据工程** | Common Crawl 处理、过滤、去重、数据混合 |\n\n## 原版课程大纲 (Spring 2026)\n\n| 讲次 | 主题 | 讲师 |\n|------|------|------|\n| 1 | 概览 & Tokenization | Percy |\n| 2 | PyTorch (einops), 资源核算 (FLOPs/内存/算术强度) | Percy |\n| 3 | 架构 & 超参数 | Tatsu |\n| 4 | Attention 替代方案 & Mixture of Experts | Tatsu |\n| 5 | GPU, TPU | Tatsu |\n| 6 | Kernel, Triton | Percy |\n| 7-8 | 并行策略 (TP/PP/DP/EP) | Percy + Tatsu |\n| 9, 11 | Scaling Laws | Tatsu |\n| 10 | 推理 | Percy |\n| 12 | 评估 | Percy |\n| 13-14 | 数据 (来源/过滤/去重/混合/合成数据) | Percy |\n| 15-16 | 训练后对齐 (SFT/RLHF/RLVR) | Tatsu |\n| 17 | 对齐 - 多模态 | Percy |\n| 18-19 | 客座讲座 | Daniel Selsam, Dan Fu |\n\n## 课程作业\n\n| Assignment | 内容 | 技能点 |\n|------------|------|--------|\n| **A1: Basics** | 实现 Tokenizer / 模型架构 / 优化器，训练最小语言模型 | Transformer 全栈实现 |\n| **A2: Systems** | Profile 模型 → Triton 实现 FlashAttention2 → 分布式训练 | 性能分析 + CUDA/Triton 内核 |\n| **A3: Scaling** | 拟合 Scaling Law，预测最优模型规模 | 实验设计 + 数学建模 |\n| **A4: Data** | 处理 Common Crawl → 过滤/去重 → 提升模型质量 | 数据工程全链路 |\n| **A5: Alignment** | SFT + RL (RLVR) 训练数学推理，可选 DPO 安全对齐 | 对齐技术实战 |\n\n## 中文通识读本特色\n\n- 面向高中生也能读懂，但**不删减专业术语**\n- 每章配有原创示意图辅助理解\n- 中文本地化阅读体验，降低 CS336 原版门槛\n- HTML 和 PDF 双格式，免费开源\n\n## 学习建议\n\n搭配使用：**中文读本通览概念 → 原版课程视频深入理解 → Assignment 动手实现**。\n\n| 资源 | 用途 | 难度 |\n|------|------|------|\n| 中文通识读本（feigaobox10） | 通览全局，建立概念框架 | 高中水平 |\n| YouTube 课程视频 | 深入原理解析 | 本科生/研究生 |\n| Stanford 课程作业 (GitHub) | 动手实现从 Tokenizer 到 Alignment 全流程 | 高阶（PyTorch/Triton） |\n\n## 与现有资源关联\n\n- [Build a LLM (From Scratch)](llms-from-scratch.md) — Sebastian Raschka 英文版从零构建 LLM，互补学习\n- [LLM 算法与工程学习路线](llm-algorithm-engineering-roadmap.md) — 更工程化/实战导向的路线图\n\n_Last updated: 2026-06-28_\n\n","path":"0-Resources/3-Tutorials/cs336-language-modeling-from-scratch.md"}]},{"name":"推理模型","items":[{"title":"Build a Reasoning Model (From Scratch)","short":"Build a Reasoning Model","desc":"Sebastian Raschka 著，推理型 LLM 构建（GRPO/蒸馏/推理时扩展）","date":"2026-05-07","tags":["reasoning","llm","reinforcement-learning","grpo","distillation","pytorch","book"],"content":"\n> Sebastian Raschka 著，从预训练模型出发构建推理型 LLM\n> GitHub: https://github.com/rasbt/reasoning-from-scratch（4.3k+ Stars）\n\n## Overview\n\nManning 2025 年出版的 *Build a Reasoning Model (From Scratch)* 官方代码仓库。从预训练基座模型（Qwen3）出发，用 PyTorch 逐步实现具备推理能力的大语言模型，涵盖推理时扩展、强化学习训练、知识蒸馏三大路线，呼应 DeepSeek R1 等推理模型的技术范式。\n\n## 内容覆盖\n\n| 章节 | 主题 |\n|------|------|\n| Ch 1 | 理解推理模型 |\n| Ch 2 | 用预训练 LLM 生成文本 |\n| Ch 3 | 评估推理模型 |\n| Ch 4 | 推理时扩展（多数投票等） |\n| Ch 5 | 推理时扩展——自我精炼 |\n| Ch 6 | 强化学习训练推理模型（GRPO） |\n| Ch 7 | 改进 GRPO |\n| Ch 8 | 蒸馏推理模型以提高效率 |\n\n附录：Qwen3 源码解析 / 更大 LLM / 批处理与吞吐量 / LLM 评估方法 / 构建聊天界面\n\n## 核心路线\n\n1. **Inference-time Scaling** — 不重新训练，在推理阶段提升推理质量（多数投票 / 自我精炼）\n2. **Reinforcement Learning (GRPO)** — 用强化学习训练推理行为\n3. **Knowledge Distillation** — 将推理能力压缩到更小模型\n\n## 适合谁\n\n- 已读过 *LLMs-from-scratch* 或对 LLM 内部机制有基本了解\n- Python + PyTorch 熟练\n- Ch 2-4 可在消费级 CPU/GPU 运行；Ch 5-7 建议 GPU\n\n---\n\n_Last updated: 2026-05-07_\n","path":"0-Resources/3-Tutorials/reasoning-from-scratch.md"}]}]},{"name":"训练与分布式","skills":[{"name":"扩展与并行","items":[{"title":"The Ultra-Scale Playbook","short":"The Ultra-Scale Playbook","desc":"HF/nanotron 出品：从单卡到 512 GPU 的 LLM 训练扩展实战（DP/TP/PP/CP/EP + ZeRO + 混合精度）","date":"2026-08-07","tags":["distributed-training","moe","gpu","scaling","book","huggingface"],"content":"\n> Hugging Face / nanotron 团队出品的开源「书式长文」，系统拆解如何把 LLM 训练从 1 张 GPU 扩展到数百、上千张 GPU。\n> 官方空间: https://huggingface.co/spaces/nanotron/ultrascale-playbook\n\n## Overview\n\n《The Ultra-Scale Playbook: Training LLMs on GPU Clusters》是 Hugging Face 团队（nanotron）开源的训练扩展实战指南，被作者称为「博客 / 书」。它基于 distill.pub 的排版模板，目标是把「大模型训练背后的工程黑箱」彻底打开——既讲清楚每种分布式训练技术**为什么存在、高層原理、优势与局限**，又给出**可复现的代码与基准实验**。\n\n作者团队在自家集群上跑了 **4100+ 次分布式实验（含测试运行超 16k 次）、最多用到 512 张 GPU**，扫描了各种分布式训练布局与模型规模，用真实吞吐 / GPU 利用率数据支撑全书的结论。阅读时间约 2–4 天。\n\n全书建立在三大支柱上：\n1. **理论速览**：在写代码前先理解每种方法的高层原理、优劣势；搞清 Transformer 的哪些部分在吃显存、训练哪个阶段吃。\n2. **清晰代码实现**：教学参考用 [picotron](https://github.com/xformers-project/picotron)（单文件、自包含、易读）；生产代码参考 [nanotron](https://github.com/huggingface/nanotron)（HF 真实训练代码库）。\n3. **真实效率基准**：给出在自家集群上 benchmark 多种配置的方法，而非空泛的「统一配方」。\n\n> 它是「FineWeb 博客（预训练数据处理）」的续篇（三部曲之二），读完两篇基本掌握当今 LLM 如何被构建的核心知识。\n\n## 章节结构（沿着一条主线推进）\n\n- **导论**：5D 并行策略交互地图\n- **第 1 章 单 GPU 训练**：显存剖析器（权重 / 梯度 / 优化器状态 / 激活 + 重算策略计算器）\n- **第 2 章 数据并行 + ZeRO**：ZeRO 1/2/3 的显存分片可视化\n- **第 3 章 张量并行（TP）**：column/row-linear 切分动画 + TP/SP 流程\n- **第 4 章 上下文并行（CP）**：Ring Attention 动画 + Zig-Zag 负载均衡\n- **第 5 章 流水线并行（PP）**：AFAB vs 1F1B 气泡调度模拟器\n- **第 6 章 专家并行（EP / MoE）**：MoE 路由与 all-to-all 通信可视化\n- **第 7 章 5D 并行总览**：5D 配置探索器（GPU 网格图 + 合理性检查）\n- **第 8 章 最佳配置**：三步配置向导\n- **第 9 章 深入 GPU**：矩阵乘 tiling 与显存合并（coalescing）动画\n- **第 10 章 FlashAttention 与混合精度**：浮点格式探索器（FP32/BF16/FP16/FP8）\n- **附录 A0–A3**：集合通信动画台 / 玩具 profiler trace / 数量级计算器 / 重叠条件计算器\n\n## Key Takeaways\n\n- **覆盖的并行技术全谱**：数据并行（DP）、张量并行（TP）、流水线并行（PP）、上下文并行（CP）、专家并行（EP），以及把它们组合的 **5D 并行**；外加 ZeRO、kernel fusion、混合精度、梯度累积、FP8。\n- **显存是第一约束**：先学会拆解「哪部分吃显存、何时吃」，再用并行化解决显存墙、用扩 GPU 提升吞吐。\n- **通信是规模化瓶颈**：集群越大，GPU 间通信开销越成为主导；书中对 All-reduce / All-gather 等集合通信有专门动画与优化讨论。\n- **没有银弹配方**：最优并行策略高度依赖硬件（芯片类型、互联、带宽），书给出的是「如何 benchmark 自己集群」的方法论与工具，而非一刀切建议。\n\n## My Notes\n\n- **定位**：比单篇博客系统、比论文可复现——是补齐「分布式训练工程直觉」的顶级一手资料，与本站 `JAX Scaling Book`、`CS336`、`AI Infra 其实没有多少新东西`、`Infra Seminars 2026` 形成强互补。\n- **学习顺序建议**：先吃透第 1–2 章（单卡显存剖析 + DP/ZeRO），这是理解后面一切的基础；再按 TP → CP → PP → EP 推进，最后用第 7–8 章的 5D 总览把碎片拼成完整拼图。\n- **实操价值**：picotron 的短文件实现非常适合逐行精读；想看生产级写法直接对照 nanotron。配套的交互计算器（显存 / 5D 配置 / 浮点格式）强烈建议动手玩一遍。\n- **中文读者**：社区已有繁体中文全译本（ultrascale-playbook-zh-tw，含每章交互实验），英文吃力时可对照，但建议以官方英文原版为准。\n\n## 资源链接\n\n- 官方阅读空间: https://huggingface.co/spaces/nanotron/ultrascale-playbook\n- 教学代码库 picotron: https://github.com/xformers-project/picotron\n- 生产代码库 nanotron: https://github.com/huggingface/nanotron\n- 前篇 FineWeb 博客（预训练数据处理）: https://huggingface.co/spaces/HuggingFaceFW/blogpost-fineweb-v1\n- 繁体中文社区译本（对照用）: https://github.com/tsai1278/ultrascale-playbook-zh-tw\n\n---\n\n_Last updated: 2026-08-07_\n","path":"0-Resources/3-Tutorials/ultrascale-playbook.md"},{"title":"JAX Scaling Book","short":"JAX Scaling Book","desc":"JAX 官方 LLM Scaling 实战书籍，分布式训练全链路","date":"2026-04-25","tags":["scaling","distributed-training","jax","llm","book"],"content":"\n## 核心要点（摘要）\n\nJAX 官方团队出品的 LLM Scaling 实战书籍，系统讲解如何用 JAX/TPU 进行大规模模型训练的分布式扩展。\n\n## 详细内容\n\n- 覆盖 LLM 训练的 Scaling 全链路：数据并行、模型并行、流水线并行\n- JAX 生态下的分布式训练最佳实践\n- 适合理解大模型训练的系统工程层面\n\n## 个人备注\n\n推理学习路线中的模型层参考。理解 scaling 才能理解推理优化的输入端——大模型是怎么训出来的，哪些结构特性影响推理效率。\n\n_Last updated: 2026-04-25_\n","path":"0-Resources/3-Tutorials/jax-scaling-book.md"}]},{"name":"ML 系统","items":[{"title":"Machine Learning Systems (Harvard CS249r)","short":"Machine Learning Systems","desc":"MIT Press 2026 两卷本：单机→fleet 规模 28 章，配 TinyTorch/MLSys·im/Labs 生态","date":"2026-10-20","tags":["ml-systems","ai-infra","tinyml","distributed-training","inference","hardware","mit","book","open-access"],"content":"\n> 哈佛 Vijay Janapa Reddi 团队的 ML 系统教材，MIT Press 2026 出版、**完全免费开放**（GitHub 28k★，月均 3.2 万读者 / 210 个国家）。自我定位「AI engineering 的物理学」——**principles-first**，从单机到 fleet 规模讲 ML 系统如何被构建、优化与部署。两卷本 + 完整课程生态（交互 Lab / 从零造框架 / 性能建模 / 真硬件部署 / 面试题库）。\n\n## 两卷结构（共 28 章）\n\n### Volume I — Introduction to Machine Learning Systems（单机）\n\n| 部分 | 章节 |\n|------|------|\n| Part I Foundations | ML Systems · ML Workflow · Data Engineering |\n| Part II Development | Neural Computation · Network Architectures · ML Frameworks · Model Training |\n| Part III Optimization | Data Selection · **Model Compression** · **Hardware Acceleration** · Benchmarking |\n| Part IV Deployment | Model Serving · ML Operations · Responsible Engineering |\n| 附录 | D·A·M 分类法（Data/Algorithm/Machine 三元）、各维度基础、System Assumptions、Glossary |\n\n### Volume II — Machine Learning Systems at Scale（fleet 规模）⭐\n\n| 部分 | 章节 |\n|------|------|\n| Part I The Fleet | Compute Infrastructure · **Network Fabrics** · Data Storage |\n| Part II Distributed ML | **Distributed Training** · **Collective Communication** · Fault Tolerance · Fleet Orchestration |\n| Part III Deployment at Scale | **Performance Engineering** · **Inference at Scale** · Edge Intelligence · ML Operations at Scale |\n| Part IV The Responsible Fleet | Security & Privacy · Robust AI · Sustainable AI · Responsible AI |\n| 附录 | Single-Machine Foundations (D·A·M) · **C³ 分类法**、Fleet/Communication/Reliability/Inference 基础 |\n\n> Vol II 是这本书对你最直接的部分：计算基建、网络 fabric、集合通信、分布式训练、推理服务、性能工程——正是 AI Infra 岗的核心知识域。\n\n## 课程生态（不止是书）\n\n| 组件 | 作用 |\n|------|------|\n| **Labs** | Marimo 交互笔记本：改参数看哪里崩，建立直觉 |\n| **TinyTorch** | 20 个递进模块从零造 ML 框架（零魔法） |\n| **MLSys·im** | 第一性原理性能建模，一条命令定位瓶颈 |\n| **Hardware Kits** | Arduino / Seeed / Grove / 树莓派真机部署，真实内存与功耗预算 |\n| **StaffML** | ML 系统岗面试题（物理推导向）+ mock interview |\n| **Instructor Hub** | 两学期教学大纲、教学法指南、评分标准、TA 手册 |\n| **Lecture Slides** | 35 套 Beamer 讲义 + 280 张原创 SVG 图 |\n\n## 许可（按组件不同，引用时注意）\n\n| 组件 | 许可 |\n|------|------|\n| 教材 / Labs / Kits / Slides / 讲师材料 | CC-BY-NC-SA 4.0（非商业，需署名，相同方式共享） |\n| TinyTorch | MIT（可商用） |\n| MLSys·im | Apache 2.0（可商用） |\n| StaffML | AGPL v3（copyleft，改造后提供服务须开源） |\n\n## 与库内资源的分工\n\n- **vs Ultra-Scale Playbook**：那本专精训练并行（DP/TP/PP/CP/EP + ZeRO）实战，这本 Vol II 覆盖更宽（网络 fabric / 集合通信 / 容错 / 推理 / 可持续性）\n- **vs 深入理解 AI Infra（李博杰）**：中国视角、量化估算方法论、\"数据搬移\"主线；这本是 MIT Press 教材体例，principles-first + 完整课程包\n- **vs JAX Scaling Book**：那本是 JAX 单栈实操，这本是跨框架的系统原理\n- **互补 MIT 6.5840**：6.5840 给分布式系统基础（Raft/一致性），这本 Vol II 给 ML 场景下的分布式训练与推理\n\n## 建议读法\n\n1. **Vol I 的 Part III（压缩/硬件加速/benchmark）** + **Vol II 的 Part II（分布式训练/集合通信）** 优先——与你 CUDA + 推理优化主线最贴\n2. 配合 **MLSys·im** 做量化估算练习（比纯读公式有效）\n3. **TinyTorch** 当造框架的实战补充，比读源码门槛低\n4. 面试准备用 StaffML（物理推导型问题，和外企 infra 岗考察方式接近）\n\n_Last updated: 2026-10-20_","path":"0-Resources/3-Tutorials/machine-learning-systems-book.md"}]},{"name":"数据工程","items":[]}]},{"name":"推理与部署","skills":[{"name":"推理系统原理","items":[{"title":"大模型推理系统入门","short":"大模型推理系统入门","desc":"从模型优化到调度优化：PagedAttention/Continuous Batching/Speculative Decoding","date":"2026-06-05","tags":["inference","vllm","sglang","optimization"],"content":"\n> 以 vLLM / SGLang 为主线，系统性建立 LLM 推理系统技术地图\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **作者** | 一起推理吧（公众号） |\n| **类型** | 系统入门科普 |\n\n## 推理基础\n\n- **两阶段**：Prefill（并行计算，计算密集型）→ Decode（逐 token 生成，显存密集型）\n- **核心指标**：TTFT（首 token 延迟）、TPOT（每输出 token 延迟）、Throughput（吞吐量）、Tail Latency (P95/P99)\n\n## 模型侧优化\n\n| 技术 | 说明 |\n|------|------|\n| **KV Cache 管理** | PagedAttention — 分页管理，减少显存碎片（vLLM 核心技术） |\n| **Attention 优化** | FlashAttention — IO-aware，减少 HBM 数据搬运 |\n| **MLP 优化** | MoE — 稀疏激活，减少无效计算 |\n| **分布式并行** | TP / PP / DP / EP 四种并行策略 |\n\n## 系统侧优化\n\n| 技术 | 说明 |\n|------|------|\n| **Batching** | Static → Dynamic → Continuous → Selective 演进路线 |\n| **调度优化** | Chunked Prefill / Disaggregated（Prefill-Decode 分离）解决冲突与平衡 |\n| **Prefix Caching** | 复用共享前缀计算，Cache-aware Scheduling |\n| **Speculative Decoding** | 小模型候选 + 大模型批量验证，加速推理 |\n| **Admission Control** | 限流、公平性、长尾控制 |\n\n## 与现有资源关联\n\n此文章的系统级视角与以下资源互补：\n\n- [nano-vllm](https://github.com/70asunflower/ai-learning-journey/blob/master/0-Resources/4-Tools-Frameworks/nano-vllm.md) — vLLM 核心原理（PagedAttention / Continuous Batching）极简实现\n- [mini-sglang](https://github.com/70asunflower/ai-learning-journey/blob/master/0-Resources/4-Tools-Frameworks/mini-sglang.md) — SGLang 另一技术路线（RadixAttention / 前缀缓存）\n- [Infinitensor 冬令营 2025](https://github.com/70asunflower/ai-learning-journey/blob/master/0-Resources/3-Tutorials/infinitensor-winter-camp-2025.md) — 推理 infra 全栈训练营\n\n_Last updated: 2026-06-05_\n","path":"0-Resources/3-Tutorials/llm-inference-system-intro.md"},{"title":"LLM Inference Handbook (Modular)","short":"LLM Inference Handbook","desc":"官方 LLM 推理手册：概念/指标/优化/GPU架构/部署模式（含交互计算器）","date":"2026-08-01","tags":["inference","docs","serving","gpu","optimization"],"content":"\n## 核心要点（摘要）\n\nModular 出品的 **LLM 推理技术手册**：把碎片化的 LLM 推理知识（散落在论文、厂商博客、GitHub issue、Discord）系统化整理成\"术语表 + 指南 + 参考\"三合一，覆盖从核心概念、性能指标到优化技术与生产部署的完整链路，并配套大量交互式计算器/模拟器/可视化。\n\n## 详细内容\n\n- **定位**：面向在自家基础设施上部署/扩缩/运维 LLM 的工程师（从微调小模型到大规模自建部署）\n- **内容板块**：\n  - LLM 推理基础：推理与训练差异、TTFT / TPOT / E2EL / goodput 等指标、上下文窗口\n  - 推理优化：continuous batching、prefix caching、chunked prefill、PD 分离（prefill-decode disaggregation）、KV cache 卸载与量化\n  - GPU 架构基础：线程 / warp / SM / 显存层级、kernel 优化\n  - 部署模式：BYOC（自带云）、on-prem 私有化\n- **交互工具（亮点）**：推理可视化器、生命周期可视化器、逐词元解码循环、延迟时间线、上下文窗口模拟器、延迟指标沙盒、Top-p vs Top-k 过滤、模型浏览器、GPU 对比表、GPU 显存计算器、量化显存影响可视化、批处理策略模拟器、chunked prefill 调度器、KV Cache 显存计算器、GPU 执行与显存映射\n- **形式**：在线网页 + 每页可追加 `.md` 的 Markdown 版本（含 `llms.txt` 索引），持续更新\n- **作者/源码**：Modular · https://github.com/modular/llm-inference-handbook\n\n## 个人备注\n\n推理部署层的\"权威速查手册\"，与仓库内 大模型推理系统入门、inferflux（交互可视化）互补：本手册偏系统化的概念/指标/优化参考，inferflux 偏单点交互演示。建议作为部署前/调优时的常备查阅源；其中的 goodput / PD 分离 / KV cache 计算器等可与 inferflux 计算器对照使用。\n\n_Last updated: 2026-08-01_\n","path":"0-Resources/1-Official-Docs/llm-inference-handbook.md"}]},{"name":"推理引擎","items":[{"title":"vLLM 中文文档","short":"vLLM 中文文档","desc":"vLLM 官方中文文档（hyper.ai 翻译）：安装/量化/LoRA/分布式推理/部署/设计文档/API","date":"2026-07-07","tags":["vllm","inference","serving","llm","quantization","lora","docs","chinese"],"content":"\n## 核心要点（摘要）\n\nvLLM 是快速、易用的 LLM 推理与服务库，最初由 UC Berkeley Sky Computing Lab 开发，现为社区驱动项目。本项目页面是 **vLLM 官方文档的中文翻译版**（英文原版位于 docs.vllm.ai），覆盖从安装到源码设计的完整链路，是中文环境下学习推理/服务框架最权威的参考资料。\n\n核心能力：PagedAttention 显存管理、连续批处理（Continuous Batching）、CUDA/HIP Graph 快速执行、多种量化（GPTQ/AWQ/INT4/INT8/FP8）、推测性解码、分块预填充、张量/流水线并行、OpenAI 兼容 API 服务器、前缀缓存、多 LoRA。\n\n## 主要内容（按文档分区）\n\n- **快速开始** — [安装](https://vllm.hyper.ai/docs/getting-started/installation/) · [Quickstart](https://vllm.hyper.ai/docs/getting-started/quickstart) · [示例](https://vllm.hyper.ai/docs/getting-started/examples/offline-inference/) · [FAQ](https://vllm.hyper.ai/docs/getting-started/faq) · [V1 用户指南](https://vllm.hyper.ai/docs/getting-started/v1-user-guide)\n- **支持模型** — [模型列表](https://vllm.hyper.ai/docs/models/supported_models) · [生成模型](https://vllm.hyper.ai/docs/models/generative_models) · [池化模型](https://vllm.hyper.ai/docs/models/Pooling%20Models)\n- **功能特性** — [量化](https://vllm.hyper.ai/docs/features/quantization/) · [LoRA](https://vllm.hyper.ai/docs/features/lora) · [工具调用](https://vllm.hyper.ai/docs/features/tool_calling) · [结构化输出](https://vllm.hyper.ai/docs/features/structured_outputs) · [自动前缀缓存](https://vllm.hyper.ai/docs/features/automatic_prefix_caching) · [分离式预填充](https://vllm.hyper.ai/docs/features/disagg_prefill) · [推测解码](https://vllm.hyper.ai/docs/features/spec_decode)\n- **训练** — [TRL 强化学习](https://vllm.hyper.ai/docs/training/trl) · [RLHF](https://vllm.hyper.ai/docs/training/rlhf)\n- **推理与服务** — [离线推理](https://vllm.hyper.ai/docs/inference-and-serving/offline_inference) · [OpenAI 兼容服务器](https://vllm.hyper.ai/docs/inference-and-serving/openai_compatible_server) · [多模态输入](https://vllm.hyper.ai/docs/inference-and-serving/multimodal_inputs) · [分布式推理](https://vllm.hyper.ai/docs/inference-and-serving/distributed_serving_new) · [生产指标](https://vllm.hyper.ai/docs/inference-and-serving/metrics) · [引擎参数](https://vllm.hyper.ai/docs/inference-and-serving/engine_args)\n- **部署** — [Docker](https://vllm.hyper.ai/docs/deployment/docker) · [Kubernetes](https://vllm.hyper.ai/docs/deployment/k8s) · [Nginx](https://vllm.hyper.ai/docs/deployment/nginx)\n- **性能** — [优化与调优](https://vllm.hyper.ai/docs/performance/optimization) · [基准测试](https://vllm.hyper.ai/docs/performance/benchmarks)\n- **设计文档** — [架构概览](https://vllm.hyper.ai/docs/design/arch_overview) · [PagedAttention](https://vllm.hyper.ai/docs/design/paged_attention) · [插件系统](https://vllm.hyper.ai/docs/design/plugin_system) · [多模态处理](https://vllm.hyper.ai/docs/design/mm_processing)\n- **V1 设计文档** — [torch.compile 集成](https://vllm.hyper.ai/docs/design-v1/torch_compile) · [前缀缓存](https://vllm.hyper.ai/docs/design-v1/prefix_caching)\n- **开发者指南** — [贡献](https://vllm.hyper.ai/docs/contributing/overview) · [性能分析](https://vllm.hyper.ai/docs/contributing/profiling_index) · [添加新模型](https://vllm.hyper.ai/docs/contributing/model/)\n- **API 参考** — [LLM 类](https://vllm.hyper.ai/docs/api/offline_interence/LLM) · [LLMEngine](https://vllm.hyper.ai/docs/api/engine/llm_engine) · [采样参数](https://vllm.hyper.ai/docs/api/inference_params)\n\n## 个人备注\n\n和仓库里 `nano-vllm`（极简实现，学原理）、`llm-inference-system-intro`（概念入门）形成三层递进：入门概念 → 极简代码 → **官方完整文档**（生产级参考）。实际做推理部署/调优时，以这份中文文档为准，比翻英文原版快很多。\n\n英文原版入口：https://docs.vllm.ai/\n\n_Last updated: 2026-07-07_\n","path":"0-Resources/1-Official-Docs/vllm-docs-zh.md"}]},{"name":"框架源码","items":[{"title":"nano-vllm","short":"nano-vllm","desc":"极简 vLLM 实现，学习推理框架核心原理（PagedAttention/Continuous Batching）","date":"2026-04-25","tags":["vllm","inference","framework","llm","serving"],"content":"\n## 核心要点（摘要）\n\n极简版 vLLM 实现，用于学习 LLM 推理框架的核心原理。剥离生产级代码的复杂度，聚焦推理框架的核心机制。\n\n## 详细内容\n\n- 推理基础设施 **框架层** 的学习项目\n- 实现了 vLLM 的核心功能：PagedAttention、Continuous Batching、KV Cache 管理\n- 代码量小，适合阅读源码理解推理框架设计\n- 与 mini-sglang 互补——同为推理框架层，但设计哲学不同\n\n## 个人备注\n\n推理框架层实战选择之一。建议路线：先读 nano-vllm 理解核心概念 → 再看 mini-sglang 理解另一种设计 → 最后看完整 vLLM/SGLang 的工程实现。\n\n_Last updated: 2026-04-25_\n","path":"0-Resources/4-Tools-Frameworks/nano-vllm.md"},{"title":"mini-sglang","short":"mini-sglang","desc":"极简 SGLang 实现，学习推理框架另一技术路线（RadixAttention/前缀缓存）","date":"2026-04-25","tags":["sglang","inference","framework","llm","serving"],"content":"\n## 核心要点（摘要）\n\nSGLang 团队出品的极简版 SGLang 实现，学习 LLM 推理框架的另一个参考实现。\n\n## 详细内容\n\n- 推理基础设施 **框架层** 的学习项目\n- SGLang 的核心设计：RadixAttention、高效前缀缓存、连续批处理\n- 代码精简，保留了推理框架的核心调度逻辑\n- 与 nano-vllm 互补——同一层的不同设计思路对比\n\n## 个人备注\n\n推理框架层实战选择之一。与 nano-vllm 对比学习效果更好：两者解决同一问题（LLM 推理服务），但 PagedAttention vs RadixAttention 是不同的技术路线。\n\n_Last updated: 2026-04-25_\n","path":"0-Resources/4-Tools-Frameworks/mini-sglang.md"}]},{"name":"系统课程","items":[{"title":"zero-to-sglang (Datawhale × RadixArk)","short":"zero-to-sglang","desc":"Datawhale×RadixArk 联合出品推理引擎课：概念→手搓 mini-sglang→读 SGLang 源码→提 PR，中英双语","date":"2026-11-10","tags":["sglang","inference","from-scratch","course","chinese","datawhale","llm","serving"],"content":"\n> **Datawhale** 与 **RadixArk**（SGLang 团队创立的公司）联合出品的推理引擎课程，1.8k★。\n> 定位非常明确：先讲清\"推理到底在做什么\"，再**手写一个 mini-sglang**，然后回到真实 SGLang\n> 源码理解前沿优化，最后带你走完提第一个 PR 的全流程。中英双语（`course-material/ch/` 与\n> `eng/`），2026-08-24 开写，**2026-11-10 全部章节完稿**；配套视频预计 11 月底上线。\n\n## 为什么值得看\n\n推理框架的教程通常走两个极端：要么停在概念层不碰代码，要么直接把你丢进 SGLang 源码里\n不知道从哪下手。这门课走中间路线——**每个抽象都落到一份可运行的代码上**：\n\n- 概念 → 为什么需要 KV Cache、prefill 与 decode 的区别、compute-bound 与 memory-bound 的真实含义\n- 实现 → 从 200 行 forward 开始，逐层加 KV Cache、HTTP 服务、Continuous Batching、Paged KV Cache、RadixAttention\n- 源码 → 回到真实 SGLang 看这些机制在生产实现里怎么做\n- 参与 → profiling / trace 分析 + CI 与 review 流程\n\n## 课程结构（4 部分 + 预备）\n\n| 部分 | 章 | 关键内容 |\n|------|----|----------|\n| **Part 0 预备** | 0.1 编码伦理与开源精神 | 管好自己的代码、像人一样沟通、先 profile、开源协作规范 |\n| | 0.2 部署第一个 SGLang 服务 | 环境搭建；在自己的 GPU 上跑 Qwen3-0.6B |\n| **Part I 基础**（纯概念，无代码、无 GPU） | 1. LLM 导论 | LLM 是什么与演进、Transformer 架构、自回归生成 |\n| | 2. 推理导论 | 训练 vs 推理、prefill/decode、compute-bound vs memory-bound、Roofline 模型 |\n| | 3. GPU 导论 | GPU 架构基础、推理在 GPU 上如何执行、从硬件角度理解瓶颈 |\n| | 4. KV Cache | 从 attention 推导 KV Cache、缓存生命周期、显存定量分析 |\n| | 5. Benchmark 导论 | TTFT / TPOT / ITL / Goodput、分位数与尾延迟、如何设计与读 benchmark |\n| **Part II 手搓 Mini SGL** | 1. 推理引擎长什么样 | 整体架构、模块拆分、本部分路线图 |\n| | 2. 请求的一生（真实 SGLang） | 一个请求从到达到响应的完整生命周期 |\n| | 3. 第一个 200 行 | embedding / attention / LM head 与生成的源码走读 |\n| | 4. KV Cache：从 O(n²) 到 O(n) | 实现缓存并优化 attention 计算 |\n| | 5. HTTP 与并发请求 | HTTP 基础与请求流；隔离、流式输出、取消 |\n| | 6. Continuous Batching 与调度器 | 连续批处理、调度器状态、资源上限、延迟与吞吐权衡 |\n| | 7. Paged KV Cache 与显存管理 | 分页 KV Cache 与 GPU 显存管理 |\n| | 8. RadixAttention 与前缀缓存 | 基数树 + 前缀复用 |\n| | 9. 多进程与张量并行 | 多进程执行与 TP |\n| | 10. 投机解码 | 起草与验证、贪心/采样接受、拒绝修正、性能权衡 |\n| **Part III 前沿技术**（深入真实 SGLang） | 1. Attention 后端 | FlashInfer / Triton / FA3 / FlashMLA 的职责、tiled attention、选型 |\n| | 2. 量化与低精度推理 | 数值格式与 scale、decode 加速、KV Cache 容量、精度权衡、量化标签与加载 |\n| | 3. 分层缓存 | L1/L2/L3 缓存层级、前缀匹配、备份恢复、预取 |\n| | 4. 扩展：DP Attention / EP / PP | TP 的扩展上限、DP Attention、EP、PP 与组合并行 |\n| | 5. Prefill-Decode 分离 | prefill 干扰、请求交接、KV 传输开销、资源配比与负载评估 |\n| **Part IV 参与贡献**（可选） | 1. 用 Cookbook 部署 | 配方选择、启动配置、服务校验、小规模 benchmark |\n| | 2. Profiling 与 Trace 分析 | profiling 基础 + 一个已合并 PR 的完整案例：trace、改动、验证 |\n| | 3. SGLang PR 流程 | 开源协作、PR 生命周期、CI 与 review、第一次贡献 |\n\n## 与库内资源的分工\n\n| 资源 | 层级 | 与本文的关系 |\n|------|------|--------------|\n| [大模型推理系统入门](llm-inference-system-intro.md) | 概念地图 | 先读它拿到全局技术地图，再进本课的 Part I 补硬件与指标细节 |\n| [nano-vllm](../4-Tools-Frameworks/nano-vllm.md) / [mini-sglang](../4-Tools-Frameworks/mini-sglang.md) | 极简实现 | 两处是\"读代码\"，本课是\"**跟着写代码**\"：Part II 就是把 mini-sglang 的思路逐步实现一遍 |\n| [vLLM 中文文档](../1-Official-Docs/vllm-docs-zh.md) | 官方文档 | 引擎层 API 与部署参数查文档；本课负责机制理解 |\n| [Infinitensor 冬令营](infinitensor-winter-camp-2025.md) / [Infra Seminars 2026](infra-seminars-2026.md) | 课程 | 更宽的 infra 全栈视角；本课是单点打穿的推理引擎专精路线 |\n\n**建议顺序**：推理系统入门（1 天）→ 本课 Part I（无 GPU，1 周）→ 本课 Part II 手搓（2–3 周，\n与 nano-vllm / mini-sglang 对读）→ Part III 挑与当前工作相关的章（量化 / PD 分离 / 并行）。\n\n## 前置与硬件\n\n- Python 熟练 + 软件工程基本习惯；PyTorch 与神经网络基础；线代与概率（知道矩阵乘和 attention 怎么算即可）\n- CUDA 基础**不要求**（Part I 从零补）；**Part I 完全不需要 GPU**，Part II 大部分可在 CPU 调试，\n  Part III 的完整实现与性能测试建议上 GPU（云也行）\n- 无 GPU 也能走完 60% 的内容，这是它比多数推理课门槛低的地方\n\n## 注意点\n\n- ⚠️ 仓库约 **133 MB**（含图片/站点资源），`git clone` 慢；只要正文可加 `--depth 1`\n- License：README/LICENSE 声明 **CC BY-NC-SA 4.0**（GitHub 未自动识别 SPDX，转载前以原文为准）\n- 视频课标\"11 月底补完\"，Youtube / B 站链接会陆续补进 Syllabus，目前以文字版为准\n- 在线阅读：[中文](https://datawhalechina.github.io/zero-to-sglang/ch/) ·\n  [English](https://datawhalechina.github.io/zero-to-sglang/eng/)\n\n## 个人备注\n\n目前 AI Infra 学习里最缺的一块恰好是\"引擎内部怎么组织\"——之前读 nano-vllm / mini-sglang\n基本是看代码猜意图，缺一条从概念到实现的连续推导。这门课的 Part II 按\"加一个特性 → 跑一次\n性能对比\"组织，正好补这条线；Part III 的 PD 分离与量化两章和手上的推理侧工作直接相关，\n优先级排在 Part IV 之前。\n\n_Last updated: 2026-11-10_\n","path":"0-Resources/3-Tutorials/zero-to-sglang.md"},{"title":"Infinitensor 冬令营 2025","short":"Infinitensor 冬令营 2025","desc":"推理 infra 全栈训练营，覆盖模型层/框架层/算子层","date":"2026-04-25","tags":["inference","ai-infra","course","kernel","framework","model"],"content":"\n## 核心要点（摘要）\n\n推理基础设施全栈训练营，覆盖推理 infra 三层架构：模型层 → 框架层 → 算子层。推荐作为推理方向系统学习的入口。\n\n## 详细内容\n\n- **模型层**：大模型结构分析、推理特性、量化/剪枝等模型侧优化\n- **框架层**：推理框架设计（对应 nano-vllm / mini-sglang 这类项目）\n- **算子层**：底层算子优化（对应 FlashAttention v1/v2/v3 这类工作）\n- 实战建议：三层都了解，选其中一层深耕\n  - 框架层 → nano-vllm / mini-sglang\n  - 算子层 → FlashAttention v1/v2/v3\n\n## 个人备注\n\n推理 infra 的\"全景图\"训练——三层架构的划分非常清晰，帮助定位自己想深耕的方向。推荐先过一遍冬令营的整体内容建立框架认知，再选某一层深入实战。\n\n_Last updated: 2026-04-25_\n","path":"0-Resources/3-Tutorials/infinitensor-winter-camp-2025.md"},{"title":"Infra Seminars 2026","short":"Infra Seminars 2026","desc":"LCPU 出品 AI 基础设施系列课：Kernel&编译器 / 互联通信 / 推理服务 / 分布式 RL","date":"2026-08-03","tags":["ai-infra","gpu","cuda","kernel","compiler","distributed-training","inference","reinforcement-learning","course"],"content":"\n> 由 LCPU 社团骨干与超算队设计的 AI 基础设施系列课程，覆盖「大模型如何训更快、跑更好、推更省」。\n> 官网: https://infra.seminars.lcpu.dev/ ｜ 课程日历: https://infra.seminars.lcpu.dev/schedule\n\n## Overview\n\nInfra Seminars 是一套面向工业界大规模模型训练与推理前沿的公开课，从 Kernel 到编译器、从分布式系统到集合通信、从模型推理到强化学习系统，力求揭示真实 AI Infra 的最底层逻辑。课程采取「主题分享 → 现场讨论 → Guest Lecture → 代码实践 → 资料开源」的闭环，讲义与作业统一开源、持续更新。\n\n## 四个 Topic（课程体系）\n\n### Topic 1 — Kernel & ML Compiler\n从 GPU 体系结构与 CUDA 出发，沿 Layout、数据复用与流水线一路抵达高性能 GEMM、Attention 与 MoE Kernel，并理解 DSL / ML Compiler 如何简化开发与自动优化。\n- 关键词：CUDA · Triton · TileLang · Tensor Core · Warp Specialization · Pipeline Ordering · ML Compiler\n\n### Topic 2 — Interconnect & Communication\n从互联网络与集合通信的视角理解大规模系统的真实效率瓶颈。\n- 关键词：RDMA · NCCL · Scale-Up · Scale-Out · Network Fabric · Memory-Storage Co-design\n\n### Topic 3 — LLM Serving & Inference\n围绕 KV Cache、调度与并行策略，理解推理优化的目标，并实践真实推理在系统层面的优化。\n- 关键词：KV Cache Centric Systems · Batching · PD 分离 · Spec Decode · vLLM\n\n### Topic 4 — Distributed Reinforcement Learning Systems\n当训练、推理、奖励与环境同时出现，如何系统性解决长尾、资源调度、权重同步、容错与训推一致性等问题。\n- 关键词：PPO · veRL · Rollout · Agentic RL · 训推一致性 · 分布式 RL 系统\n\n## 已公开的 Session 与资料（Topic 1）\n\n| 日期 | Session | 内容 | 回放 / 资料 |\n|------|---------|------|-------------|\n| 2026-07-26 | Session 1.0/1.1/1.2 | 从 HPC 到 AI Infra（并行计算与并行编程）· CUDA 编程模型 · Triton/TileLang Tile Level 编程 | [1.0 回放](https://www.bilibili.com/video/BV1u83w6DEfG) · [1.1 回放](https://www.bilibili.com/video/BV1g83w6DETm) · [1.2 回放](https://www.bilibili.com/video/BV1Sb3w6nE8v) · [Topic 1 讲义](https://infra.seminars.lcpu.dev/wiki/VWJPwVFTHifeadkE4phc45hOntg) · [A01 作业](https://infra.seminars.lcpu.dev/assignments#assignment-A01) |\n| 2026-07-30 | Session 2：Memory Abstraction & Hierarchy | CUDA Core FP32 GEMM 主线，data reuse 与 memory hierarchy，Roofline Model，SM/warp/coalescing/latency hiding/shared memory bank conflict/padding/swizzle/per-thread microtile，Nsight Compute 调优 | [2.1 回放](https://www.bilibili.com/video/BV1gqGA6ZEfg) · [2.2 回放](https://www.bilibili.com/video/BV1L8GA6YEAH) |\n| 2026-08-01 | Workshop 1：Parallel Programming with TileLang | TileLang 语法、用 TileLang 写 Kernel、CTA→Thread 映射与 Layout Inference、Latency Hiding、DSL JIT 编译与 Host 侧、算子优化与工具 | [腾讯会议](https://meeting.tencent.com/dm/MWmIhQau1Yb0) · [B站直播](https://live.bilibili.com/22591408) · [LCPU Live](https://live.lcpu.dev/) |\n| 2026-08-02 | Session 3：Tensor Core | mma.sync（Ampere）/ wgmma（Hopper）/ tcgen05（Blackwell）三代指令演进，fragment 布局，layout 与 swizzle 解决 bank conflict，FP8 fine-grained scaling | [腾讯会议](https://meeting.tencent.com/l/r9vIJMyflfD6) · [B站直播](https://live.bilibili.com/22591408) · [LCPU Live](https://live.lcpu.dev/) |\n\n> 后续 Topic 2/3/4 的 Session 按官方日历陆续放出，资料开源更新中。\n\n## 资源链接\n\n- 官网首页: https://infra.seminars.lcpu.dev/\n- 课程日历（全部安排 / 回放 / 作业）: https://infra.seminars.lcpu.dev/schedule\n- 讲义 Wiki（Topic 1）: https://infra.seminars.lcpu.dev/wiki/VWJPwVFTHifeadkE4phc45hOntg\n- 作业与评测: https://infra.seminars.lcpu.dev/assignments\n\n## My Notes\n\n- **定位**: 比单篇博客更系统、比整本书更贴近工业界一线，是补齐「AI Infra 工程直觉」的优质系列。\n- **学习顺序**: 建议先吃透 Topic 1（Kernel & Compiler）——它是 Topic 2/3/4 的算力底座；再按 Topic 3（推理）→ Topic 2（通信）→ Topic 4（分布式 RL）的顺序推进。\n- **与本站其他资源的衔接**: 可与 `Modern GPU Programming For MLSys`、`CS336`、`大模型推理系统入门`、`AI Infra 其实没有多少新东西` 对照阅读。\n\n---\n\n_Last updated: 2026-08-03_\n","path":"0-Resources/3-Tutorials/infra-seminars-2026.md"}]},{"name":"性能测量","items":[{"title":"AIPerf (NVIDIA)","short":"AIPerf","desc":"GenAI-Perf 官方继任者，底层重写：多进程负载生成 + 15+ 端点 + 泊松/伽马流量 + TTFT/ITL 分位数","date":"2026-11-14","tags":["inference","benchmarking","llm","serving","gpu","tool","vllm","sglang","telemetry","open-source"],"content":"\n> **NVIDIA 指定的 GenAI-Perf 继任者**，官方措辞是 \"designated successor ... and a **ground-up rewrite**\"\n> （[官方技术博客](https://developer.nvidia.com/blog/benchmarking-llm-inference-at-scale-with-aiperf/)，\n> 2026-09-18）。仓库 [ai-dynamo/aiperf](https://github.com/ai-dynamo/aiperf) 属 NVIDIA Dynamo 生态，\n> **Apache-2.0**，Python 实现，878★ / 266 forks（2026-11-14 核验），当天仍有 push。\n> 最新稳定版 **v0.13.0**（GitHub Release 2026-09-24，PyPI `aiperf` 0.13.0，文档 Latest 同为 v0.13.0）。\n\n⚠️ 时间线要说清：仓库 2025-04 就已创建并持续迭代，**2026-09-18 是官方博客正式宣布\"接班\"的日子**，\n不是项目首发。另外 \"ground-up rewrite\" 指的是**架构层重写**（不再套 Perf Analyzer、单进程改多进程），\n不是换语言重写——AIPerf 仍然是 Python，只是绕开了 GIL 的单进程上限。\n\n## 为什么必须重写：压测客户端自己先成了瓶颈\n\n高并下发压时，单进程负载发生器（curl 循环、手写 asyncio 脚本、GenAI-Perf）会先被 Python GIL\n卡住，测出来的是**客户端的上限**而不是服务端的容量。\n\n| 维度 | GenAI-Perf（旧） | AIPerf（新） |\n|------|------------------|--------------|\n| 底座 | 构建在 **Perf Analyzer** 之上（旧栈的封装） | **完全脱离 Perf Analyzer**，独立实现 |\n| 并发模型 | 单进程，高并发下 GIL-bound | **多进程**：worker 进程发负载，独立 record-processor 服务处理结果 |\n| 组件通信 | — | **ZMQ**，README 称 10 个服务相互通信 |\n| 架构分层 | — | 官方架构文档的三平面：**Control**（SystemController / Timing / Dataset / Worker Manager）、**Data**（Workers + 推理服务）、**Analytic**（Record Processors / Records / GPU Telemetry / Server Metrics） |\n| 结果可靠性 | 并发升高时读数可能失真 | 客户端不再先饱和，能真正把服务端压满 |\n\n请求生命周期：Dataset Manager 载入数据（内存映射供 worker 直读）→ Timing Manager 用 credit 机制\n按选定模式排程 → 可选 warmup 预热 JIT/缓存 → Workers 发请求并采集时间戳 → Record Processor 并行算指标\n→ Records Manager 汇总导出。\n\n## 能力清单\n\n| 类别 | 内容 |\n|------|------|\n| 端点 | 官方博客口径 **15+ 种**：chat、responses、NIM rankings、图像生成等；README 的 Supported APIs 另列 OpenAI chat/completions/embeddings/audio/images 与 NIM embeddings/rankings |\n| 负载塑形 | **constant / Poisson / gamma** 到达模式、可调突发度、并发与请求速率渐进 ramp、可变 ISL/OSL 合成分布（含 vLLM/SGLang range-ratio） |\n| 压测模式 | concurrency、request-rate、request-rate + max concurrency、**trace replay**（确定性回放生产流量） |\n| 数据 | 合成数据、ShareGPT 等公开数据集；trace 格式支持 Mooncake、Baseten、WEKA (AgentX)、Bailian、BurstGPT、SageMaker Data Capture、Weka、TraceLab 等（来源：官方博客 + 仓库 tutorials 清单） |\n| 核心指标 | **TTFT / ITL / Request Latency / Output Token Throughput**，均给 p25–p99 分位 + min/max/avg/std |\n| 硬件遥测 | 有 DCGM exporter 或本机 pynvml 时，同次运行附带 GPU 功耗、利用率、显存占用 |\n| 高级能力 | Goodput（SLA 合规率）、时间切片分析、KV Cache 效率、用户视角计时、请求取消测试、参数扫描 sweep / 自适应搜索与扩展、Pareto 曲线、Prometheus 服务端指标、Kubernetes operator/CRD |\n| 输出 | 实时 TUI dashboard（另有 simple / headless 共 3 种 UI）、控制台指标表、**CSV + JSON** 全量结果、自动绘图 |\n| 集成 | 可选 extras：`tdigest` / `mlflow` / `otel` / `wandb` |\n\n## 5 分钟上手（官方博客的基线流程）\n\n```bash\n# 安装：Python >=3.11,<3.14\npip install aiperf          # 或 uv tool install aiperf\n\n# 1) 起一个 vLLM 服务（示例模型 Qwen3-0.6B）\ndocker run --gpus all -p 8000:8000 vllm/vllm-openai:latest \\\n  --model Qwen/Qwen3-0.6B --host 0.0.0.0 --port 8000\n\n# 2) 静态基线：把 ISL/OSL 钉死在 128/128\naiperf profile \\\n  --model Qwen/Qwen3-0.6B --endpoint-type chat --streaming --url localhost:8000 \\\n  --synthetic-input-tokens-mean 128 --synthetic-input-tokens-stddev 0 \\\n  --output-tokens-mean 128 --output-tokens-stddev 0 \\\n  --extra-inputs min_tokens:128 --extra-inputs ignore_eos:true\n\n# 3) 换成真实感的泊松流量（平均 10 req/s，长度带方差，可复现）\naiperf profile \\\n  --model Qwen/Qwen3-0.6B --endpoint-type chat --streaming --url localhost:8000 \\\n  --request-rate 10 --arrival-pattern poisson \\\n  --synthetic-input-tokens-mean 512 --synthetic-input-tokens-stddev 128 \\\n  --output-tokens-mean 128 --output-tokens-stddev 32 \\\n  --random-seed 42 --request-count 200\n```\n\n三个最容易踩的坑（官方特意点名）：\n\n1. **`--streaming` 不是可选项**——不开流式，服务端会攒完整响应再返回，根本没有 first-token / decode-token 事件，TTFT 和 ITL 无从测起。\n2. **`min_tokens` + `ignore_eos` 决定结果能否复现**——否则 \"128 output tokens\" 只是建议值，模型自然结束时输出变短，吞吐被低估且各次运行不可比。\n3. **`--random-seed` 保证泊松到达与长度抽样可复现**，改配置前后对比才有意义。\n\n更轻的起点：README 的 Quick Start 用 Ollama + `granite4:350m` 本地服务，10 条请求即可跑通，CPU 也能出数。\n\n## 从 GenAI-Perf 迁移\n\n官方[迁移指南](https://docs.nvidia.com/aiperf/getting-started/migrating-from-gen-ai-perf)的定位是\n\"**对目前已支持的功能**做 drop-in replacement\"，多数参数直接对应，但下面几处必须改：\n\n| GenAI-Perf | AIPerf | 说明 |\n|------------|--------|------|\n| `--max-threads N` | `--workers-max N` | 由全局线程数改为直接控制发请求的 worker 数 |\n| `-- ...`（透传） | 删掉 | 所有参数都是原生支持，不再需要 passthrough |\n| `--server-metrics-url http://node:9400` | **`--gpu-telemetry`** | ⚠️ 旧参数名骗人：它指向 Triton/DCGM 遥测端口，**不是** Prometheus 推理服务指标。AIPerf 把两者拆开：`--gpu-telemetry`（DCGM exporter 或 `pynvml`）与 `--server-metrics`（模型端点 `/metrics`，默认开启） |\n| `inputs.json` 的 `payload` | `payloads` | 复数；数组每项代表一轮对话，新增 `session_id` 便于请求关联 |\n| `analyze` 子命令部分选项 | **尚未支持** | 官方标注 planned for future releases，迁移前先查 CLI 对比矩阵 |\n\n**推理模型（Qwen3 / DeepSeek-R1 / gpt-oss 等）口径差异**：GenAI-Perf 忽略 `reasoning_content`，\nTTFT 只算到首个非推理 token；AIPerf 把推理 token 也算进 TTFT，因此**新旧工具的数字不能直接比**。\n\n| 想对比的量 | 用 AIPerf 的哪个指标 |\n|------------|----------------------|\n| GenAI-Perf TTFT | **AIPerf TTFO**（Time to First Output Token） |\n| GenAI-Perf OSL | **AIPerf Output Token Count**（不含推理 token；AIPerf OSL 是含的） |\n\n## 与库内资源的分工\n\n| 资源 | 关系 |\n|------|------|\n| [zero-to-sglang](../3-Tutorials/zero-to-sglang.md) | 其 Part I 第 5 章讲 TTFT/TPOT/ITL/Goodput 与「如何设计并读懂一次 benchmark」；AIPerf 就是把这个章节落到实处的那把工具 |\n| [大模型推理系统入门](../3-Tutorials/llm-inference-system-intro.md) | 概念地图（PagedAttention / Continuous Batching / 投机解码）；压测看到的现象要回到这里解释 |\n| [LLM Inference Handbook](../1-Official-Docs/llm-inference-handbook.md) | 官方手册给指标定义与 GPU 架构背景 |\n| [vLLM 中文文档](../1-Official-Docs/vllm-docs-zh.md) / [nano-vllm](nano-vllm.md) / [mini-sglang](mini-sglang.md) | 被压测的服务端与对照实现；改引擎配置后用同一份 AIPerf 命令做 A/B |\n| [InferFlux](inferflux.md) | 同样围绕推理系统，但它是动画演示「机制长什么样」，AIPerf 是「真实跑出多少」 |\n\n**建议顺序**：先读概念 → 用静态 ISL/OSL 基线建立可复现的测量闭环 → 换泊松/gamma 流量看 p99 尾延迟\n→ 回放生产 trace → 再做配置 sweep 画 Pareto 曲线。读分位数（尤其 p99）而不是只看平均吞吐。\n\n## 注意点\n\n- Python **>=3.11, <3.14**；Linux aarch64 上可选依赖 `crick` 只有 sdist，需要 C 工具链（`build-essential` / `Development Tools`）；普通 `pip install aiperf` 不会拉它\n- 版本迭代很快（0.7 → 0.13，2026 年内多个 release），CLI 以[当前版本文档](https://docs.nvidia.com/aiperf/latest/)为准，别照抄旧博客命令\n- 它对 OpenAI 兼容端点友好；非兼容协议要看插件/端点类型支持情况\n- GPU telemetry 依赖 DCGM exporter 或 pynvml；**Jetson / Thor 集成 GPU 上 DCGM 是否可用，待核实**，边缘部署需实测\n\n## 个人备注\n\n库里此前收的都是「推理系统的原理、实现与\n\n> 正文已截断，完整内容请点击下方「在 GitHub 中查看原文」。","path":"0-Resources/4-Tools-Frameworks/aiperf.md"}]}]},{"name":"GPU 与 Kernel","skills":[{"name":"CUDA 编程","items":[{"title":"CUDA Programming Guide","short":"CUDA Programming Guide","desc":"NVIDIA 官方 GPU 并行编程模型文档","date":"2026-04-03","tags":["cuda","gpu","hardware"],"content":"\n## 核心要点（摘要）\n\nNVIDIA 官方 CUDA 编程模型权威文档。AI 框架底层依赖 GPU 并行计算，理解 CUDA 编程模型有助于深入优化模型推理和训练性能。\n\n## 主要内容\n\n- **CUDA C++ 编程接口** — GPU kernel 编写范式\n- **线程层次** — thread/block/grid 的组织结构\n- **内存层次** — global/shared/local/constant/texture memory\n- **执行模型** — stream、并发 kernel、同步机制\n- **硬件映射** — SM、warp execution、occupancy\n\n## 个人备注\n\n理解 GPU 底层执行模型，对 CUDA kernel 优化、vLLM/TensorRT 推理部署调优有指导意义。\n\n_Last updated: 2026-04-03_\n","path":"0-Resources/1-Official-Docs/cuda-programming-guide.md"}]},{"name":"Kernel 优化","items":[{"title":"Modern GPU Programming For MLSys","short":"Modern GPU Programming","desc":"MLC.ai/
