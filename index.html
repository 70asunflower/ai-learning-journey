CMU 出品：Blackwell GPU Kernel 实战（TMA/Warp Spec/FlashAttention 4）","date":"2026-06-25","tags":["gpu","cuda","kernel","compiler","ml-systems"],"content":"\n> MLC.ai 出品，基于 Blackwell 架构的现代 GPU Kernel 编程实战教材，源自 CMU MLSys 课程。\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **作者** | MLC.ai (Tianqi Chen 团队) |\n| **来源** | CMU Machine Learning Systems 课程系列 |\n| **编程模型** | TIRx Python DSL（贴近硬件的底层编程接口） |\n| **目标架构** | NVIDIA Blackwell (B200/B100) |\n| **核心案例** | GEMM 优化 + FlashAttention 4 |\n\n## 核心要点（摘要）\n\n本书的核心命题：现代 GPU 不再是简单设计的变体——Blackwell 引入更丰富的内存空间、新的访存模式和更专用的执行单元。要写出高性能 Kernel，需要「硬件心智模型」+「实战构建能力」二者兼备。\n\n全书按 **硬件理解 → 编程模型 → State-of-the-Art Kernel 构建** 的递进路径展开，覆盖 TMA 流水线、Persistent Scheduling、Warp Specialization、2-CTA Cluster 等前沿技术。\n\n## 目录结构\n\n### Part I: Understanding the GPU\nGPU 整体组织、编写快速 Kernel 的通用方法、数据布局、异步内存操作与协调机制。\n\n### Part II: TIRx Overview\nTIRx 语言关键元素，后续所有代码示例的基础。\n\n### Part III: GEMM — Tiled to SOTA\n从分块 GEMM 出发，逐步引入 TMA Pipelining → Persistent Scheduling → Warp Specialization → 2-CTA Clusters，完整构建 SOTA 矩阵乘法 Kernel。\n\n### Part IV: Flash Attention 4\n基于 Part III 技术栈构建完整 Attention Kernel：双 MMA + Softmax、Online-Softmax Rescaling、Causal Masking、GQA 支持。\n\n### Reference\nTIRx 语言参考与编译器内部实现。\n\n## 关键技术点\n\n| 技术 | 说明 | 阶段 |\n|------|------|------|\n| **TMA (Tensor Memory Accelerator)** | Blackwell 硬件异步数据搬运单元 | GEMM Part III |\n| **Persistent Scheduling** | 避免 Kernel 重启动开销的持久化线程调度 | GEMM Part III |\n| **Warp Specialization** | 生产者-消费者分离的 Warp 角色分工 | GEMM Part III |\n| **2-CTA Clusters** | 两个 CTA 协作共享 SMEM | GEMM Part III |\n| **Online-Softmax Rescaling** | 流式 softmax 避免全局归约 | Flash Attention IV |\n| **Causal Masking + GQA** | 生产级 Attention 必备特性 | Flash Attention IV |\n\n## 与现有资源关联\n\n- [CUDA Programming Guide](../1-Official-Docs/cuda-programming-guide.md) — GPU 编程基础，本课程的前置知识\n- [AI Infra 其实没有多少新东西](ai-infra-nothing-new.md) — AI Infra 全局视角，GPU 算子是其中关键一环\n- [大模型推理系统入门](llm-inference-system-intro.md) — 推理系统宏观视角，与本书的 Kernel 级优化互补\n- [Infinitensor 冬令营 2025](infinitensor-winter-camp-2025.md) — 覆盖推理 Infra 的算子层实战\n\n## 个人备注\n\n与现有 GPU 学习资源（CUDA Programming Guide、Infinitensor 训练营）的互补关系：CUDA Guide 是通用编程基础，本书聚焦 Blackwell 特定架构特性和 Kernel 级极致优化，且使用 TIRx DSL 提供可运行的渐进式代码。对毕设 GEMM/Attention Kernel 优化方向直接相关，计划系统学习。\n\n_Last updated: 2026-06-25_\n","path":"0-Resources/3-Tutorials/mlc-modern-gpu-programming.md"}]},{"name":"编译与汇编","items":[{"title":"Compiler Explorer (Godbolt)","short":"Compiler Explorer","desc":"在线编译器探索：实时汇编/LLVM IR/优化管线，多编译器对比，验证向量化","date":"2026-10-18","tags":["compiler","optimization","cpp","rust","cuda","interactive"],"content":"\n> 在线编译器探索工具（Matt Godbolt 创建，开源：`compiler-explorer/compiler-explorer`）。**左侧写代码，右侧实时看编译产物**——汇编、LLVM IR、AST、优化管线、控制流图，支持几十种语言与 GCC/Clang/MSVC 等主流编译器的众多版本，并可**多编译器并行对比**。性能优化与底层原理学习的日常工具。\n\n## 核心功能\n\n- **实时编译 + 汇编输出**：改一行代码立刻看到汇编变化；Intel / AT&T 语法一键切换，可反修饰（demangle）符号\n- **多编译器并行对比**：同一段代码挂多个编译器/版本（如 gcc 16.2 vs clang）并排看输出差异\n- **中间表示全覆盖**：不止汇编——AST、LLVM IR、Clang IR、Opt Pipeline（优化管线）、Opt Remarks（优化建议）、Stack Usage、Control Flow Graph、Rust MIR/HIR、GHC Core 等\n- **执行模式**：可直接运行代码看结果（Execution Only 模式）\n- **设备编译**：CUDA 设备代码查看（Device 视图），对 GPU 算子学习直接有用\n- **Conformance View**：标准一致性测试\n\n## 姊妹工具（同作者生态）\n\n| 工具 | 用途 |\n|------|------|\n| [Quick-bench](https://quick-bench.com/) | 微基准测试：A/B 两种实现直接比耗时 |\n| [CppInsights](https://cppinsights.io/) | 看编译器如何看待你的 C++（模板实例化/隐式转换展开） |\n| [ABI Explorer](https://abiexplorer.org/) | ABI/结构体布局可视化 |\n\n## 典型使用场景（AI Infra 向）\n\n- **验证向量化**：写个简单 loop，看 `-O2/-O3` 下有没有生成 AVX/NEON 指令——没向量化就回去改写法\n- **算子优化前哨**：手写 SIMD/内联汇编前，先在 Godbolt 上验证编译器自动向量化的效果\n- **对比编译器代码质量**：同一 kernel 在 gcc/clang 下哪家汇编更优\n- **跨架构对比**：x86-64 / ARM / RISC-V 目标的汇编差异（选型/移植时心里有数）\n- **理解 C++ 底层**：虚函数调用、模板实例化、`std::vector` 边界检查的开销，全都能在汇编里看见\n\n## 注意\n\n- 站点带 **Claude Explain** 功能（AI 解释汇编），会把源码+编译输出发给 Anthropic——在意隐私的代码别用；仓库对含 `no-ai` 字符串的源码会自动禁用 AI 处理（这个设计值得称赞）\n\n_Last updated: 2026-10-18_","path":"0-Resources/4-Tools-Frameworks/compiler-explorer.md"}]}]},{"name":"微调与工程","skills":[{"name":"微调方法","items":[{"title":"Unsloth LLM 微调指南","short":"Unsloth LLM 微调指南","desc":"Unsloth 官方中文教程，LoRA/QLoRA 高效微调全流程","date":"2026-04-04","tags":["fine-tuning","lora","tutorial"],"content":"\n## 核心要点（摘要）\n\nUnsloth 官方中文微调指南，覆盖从环境安装、模型选择、数据集准备、训练调参到部署的全流程。推荐 LoRA/QLoRA 高效微调方法，适合有 GPU资源的个人开发者和团队。\n\n## 详细内容\n\n### 1. 微调概述\n微调可定制模型行为、注入知识、优化特定任务性能。LoRA/QLoRA 技术仅优化 1% 权重，降低计算资源需求。\n\n### 2. 方法选择\n- **SFT（监督微调）**：标准方法\n- **RL（强化学习）**：用于特定行为优化\n- **LoRA/QLoRA**：参数高效训练，保持基础权重冻结\n- **FFT**：全量微调，需大量资源\n\n### 3. 模型建议\n初学者推荐从 Llama 3.1 (8B) 开始，使用指令模型 + 动态 4 位量化版本（如 `unsloth/llama-3.1-8b-unsloth-bnb-4bit`）。\n\n### 4. 数据集要点\n\"为获得最佳结果，请策划一个结构良好的数据集，理想状况下为问答对。\" 支持合成数据生成与文档解析。\n\n### 5. 训练参数\n- `batch_size`、`gradient_accumulation_steps`、`learning_rate`（2e-4 建议值）\n- `max_steps` 或 `num_train_epochs` 控制训练时长\n- 损失值 0.5-1.0 通常表示良好学习效果\n\n### 6. 部署选项\n- 单设备：GGUF 格式 + Ollama/llama.cpp\n- 企业场景：vLLM + FP8/AWQ\n\n### 7. 章节结构\n1. 什么是微调？\n2. 选择合适的模型和方法\n3. 你的数据集\n4. 理解训练超参数\n5. 安装与需求\n6. 训练与评估\n7. 运行与部署模型\n8. 完成\n\n## 个人备注\n\nUnsloth 是目前最成熟的 LoRA 微调工具之一，Colab 免费 GPU 可直接运行。本指南中文友好，适合作为第一个微调实战项目。\n\n_Last updated: 2026-04-04_\n","path":"0-Resources/3-Tutorials/unsloth-fine-tuning-guide.md"},{"title":"self-llm 大模型食用指南","short":"self-llm 大模型食用指南","desc":"DataWhale 社区维护的中文开源大模型入门教程，覆盖环境配置、部署使用、高效微调全流程","date":"2026-03-31","tags":["tutorial","fine-tuning","serving","chinese"],"content":"\n> 中文大模型教程项目，帮助初学者掌握开源大模型的部署、使用和微调。\n> 官网: https://github.com/datawhalechina/self-llm\n\n## Overview\n\n由 DataWhale 社区维护的开源大模型教程项目，面向国内初学者，基于 Linux 平台。覆盖环境配置、部署使用、高效微调的完整链路。\n\n## Content Structure\n\n1. **环境配置** — 针对不同模型提供详细的环境安装步骤\n2. **部署使用** — LLaMA、ChatGLM、InternLM、Qwen 等模型的部署与调用\n3. **应用集成** — 命令行调用、在线 Demo 部署、LangChain 集成\n4. **微调训练** — 全量微调、LoRA、P-Tuning、分布式微调\n\n## Models Covered\n\n- Qwen1.5 / Qwen2\n- InternLM / InternLM2\n- MiniCPM\n- LLaMA 系列\n- ChatGLM 系列\n- 及其他开源模型\n\n## My Notes\n\n- **学习顺序建议**: 环境配置 → 部署使用 → 微调训练\n- **初学者推荐模型**: Qwen1.5, InternLM2, MiniCPM\n- **价值**: 中文生态友好的教程，步骤清晰，适合快速上手实践\n\n---\n\n_Last updated: 2026-03-31_\n","path":"0-Resources/3-Tutorials/self-llm.md"}]},{"name":"微调框架","items":[{"title":"LlamaFactory 微调框架","short":"LlamaFactory 微调框架","desc":"100+ LLM/VLM 高效微调框架，支持 LoRA/QLoRA/SFT/DPO","date":"2026-04-04","tags":["fine-tuning","framework","lora","llm","chinese"],"content":"\n## 核心要点（摘要）\n\n开源大模型高效微调工具链，零代码 CLI/Web UI 支持 100+ LLM 和 VLM 微调。支持 LoRA/QLoRA、全量微调、冻结微调等多种方法，提供统一训练推理接口。\n\n## 详细内容\n\n### 主要特性\n\n- **训练方法**：全量微调、LoRA/QLoRA（2-8bit 量化）、冻结微调、GaLore/BAdam/Adam-mini 等优化算法\n- **先进算法**：DoRA、LongLoRA、PiSSA、OFT、PPO、DPO、KTO、ORPO\n- **性能优化**：FlashAttention-2、Unsloth 加速、NEFTune、RoPE 缩放\n- **监控工具**：LlamaBoard、TensorBoard、WandB、MLflow、SwanLab\n- **推理部署**：OpenAI 风格 API、vLLM/SGLang 后端、Gradio UI\n\n### 支持模型（部分）\n\nLLaMA, Llama 2/3/4, Qwen/Qwen2/Qwen3, Mistral, Mixtral, DeepSeek, Gemma, GLM, Phi, InternLM, LLaVA, MiniCPM 等 100+ 模型\n\n### 训练方式\n\n连续预训练、SFT、奖励建模、PPO、DPO、KTO、ORPO、多模态训练、Agent 微调\n\n## 个人备注\n\n与 ms-swift 类似但更专注于训练侧，中文文档完善。与 Unsloth 微调指南配合使用效果佳。\n\n_Last updated: 2026-04-04_\n","path":"0-Resources/4-Tools-Frameworks/llamafactory.md"},{"title":"ms-swift 微调部署框架","short":"ms-swift 微调部署框架","desc":"魔搭社区大模型与多模态模型全链路框架，覆盖训练→推理→评测→量化→部署","date":"2026-03-31","tags":["fine-tuning","serving","multimodal","framework"],"content":"\n> ModelScope's fine-tuning & deployment framework for LLMs and multi-modal models.\n> Official docs: https://swift.readthedocs.io/zh-cn/latest/\n\n## Overview\n\nms-swift supports 600+ text LLMs and 300+ multi-modal models through the full pipeline: training → inference → evaluation → quantization → deployment.\n\n## Key Capabilities\n\n### Training\n\n- **Lightweight**: LoRA, QLoRA, DoRA, LoRA+, LLaMAPro, LongLoRA, LoRA-GA, ReFT, RS-LoRA, Adapter, LISA\n- **Full-parameter**: DDP, DeepSpeed ZeRO2/3, FSDP/FSDP2, Megatron (TP/PP/SP/CP/ETP/EP/VPP)\n- **Memory**: GaLore, Q-Galore, UnSloth, Liger-Kernel, Flash-Attention 2/3, Ulysses, Ring-Attention\n- **Quantization training**: BNB, AWQ, GPTQ, AQLM, HQQ, EETQ — 7B training needs only 9GB VRAM\n- **Multi-modal**: Packing (100%+ speedup), text/image/video/audio mixed training, vit/aligner/llm separate control\n- **Reinforcement learning**: GRPO, DAPO, GSPO, SAPO, CISPO, CHORD, RLOO, Reinforce++\n- **Preference tasks**: DPO, KTO, RM, CPO, SimPO, ORPO, GKD\n\n### Inference & Deployment\n\n- **Engines**: PyTorch, vLLM, SGLang, LmDeploy\n- **API**: OpenAI-compatible interface\n- **Quantization export**: AWQ, GPTQ, FP8, BNB\n- **Evaluation**: EvalScope backend with 100+ datasets\n\n### Hardware\n\n- NVIDIA: A10, A100, H100, RTX series, T4, V100\n- CPU, MPS\n- Ascend NPU (domestic)\n\n## Why ms-swift?\n\n- **Day-0 support** for popular models\n- **150+ built-in datasets** for pre-training, SFT, human alignment, multi-modal\n- **One-command training** — just prepare your dataset and go\n- **Web-UI** available for training, inference, evaluation, and quantization\n\n---\n\n_Last updated: 2026-03-31_\n","path":"0-Resources/4-Tools-Frameworks/ms-swift.md"}]},{"name":"环境与选型","items":[{"title":"ModelScope Notebook 免费试用","short":"ModelScope Notebook","desc":"魔搭云上开发环境，开箱即用 GPU/CPU，提供免费使用时长","date":"2026-03-31","tags":["cloud","chinese"],"content":"\n> ModelScope（魔搭社区）提供的云上 Notebook 开发环境，开箱即用，包含免费 GPU/CPU 资源。\n> 官方文档: https://www.modelscope.cn/docs/notebooks/free-trial\n\n## Overview\n\nModelScope Notebook 是一个开箱即用的云上开发环境，基于 GPU 和 CPU 资源，预装 ModelScope 开发镜像，为社区注册用户提供免费使用时长。\n\n## 核心特性\n\n- **开箱即用**: 预装开发环境镜像，无需手动配置依赖\n- **免费时长**: 注册用户可免费使用一定时长\n- **GPU 支持**: 支持 GPU 加速推理/训练\n- **CPU 实例**: 也提供 CPU 实例供轻量使用\n- **云上体验**: 浏览器直接开发，无需本地环境\n\n## ModelScope 平台概览\n\nModelScope（魔搭社区）是阿里达摩院开源的 AI 社区平台，提供一站式 AI 开发服务：\n\n| 功能 | 说明 |\n|------|------|\n| **模型库** | 开源模型托管与发现（NLP、CV、语音、多模态等） |\n| **数据集** | 各领域数据集托管 |\n| **Studio（创空间）** | 基于 Gradio 的 AI 应用开发平台 |\n| **Notebook** | 免费 GPU/CPU 云上开发环境 |\n| **Library** | Python 库，统一加载各域模型 |\n| **模型训练与推理** | 基于 SWIFT 框架的大模型训练/微调 |\n| **模型服务** | 云端模型部署与推理服务 |\n| **评测（司南）** | 模型能力评测与基准测试 |\n\n## 使用场景\n\n- 快速验证开源模型（推理、测试）\n- 轻量微调/训练实验\n- 学习 AI 技术栈\n- 部署在线 Demo\n\n## 相关链接\n\n- [免费试用文档](https://www.modelscope.cn/docs/notebooks/free-trial)\n- [Notebook 工作台](https://www.modelscope.cn/studio/Notebook)\n- [ModelScope 主页](https://www.modelscope.cn)\n\n---\n\n_Last updated: 2026-03-31_\n","path":"0-Resources/4-Tools-Frameworks/modelscope-notebook.md"},{"title":"CanIRun.ai 硬件兼容性检测","short":"CanIRun.ai 硬件兼容性检测","desc":"检测本地 GPU/VRAM/RAM 能跑哪些本地大模型，支持 llama.cpp/Ollama/LM Studio 数据源","date":"2026-04-09","tags":["local-ai","quantization","gpu"],"content":"\n## 核心要点（摘要）\n\nCanIRun.ai 是一个免费的在线工具，帮助用户检测自己的电脑硬件配置能跑哪些本地 AI 模型。网站自动识别 GPU、VRAM、RAM 和 CPU 规格，然后在浏览器端展示与硬件匹配的模型列表及兼容性评分。\n\n## 详细内容\n\n### 功能特性\n\n- **硬件自动检测**：通过浏览器 API 自动检测 GPU 型号、显存、内存、CPU 等规格\n- **兼容性评级**：Runs great / Runs well / Decent / Tight fit / Barely runs / Too heavy 六档\n- **多维度筛选**：按任务类型（Chat / Code / Reasoning / Vision）、提供商（Meta / Google / OpenAI 等）、许可证、架构类型（Dense / MoE）筛选\n- **排序方式**：按参数量、上下文长度、显存占用、速度、人气排序\n- **量化格式**：显示各模型的量化等级（Q2_K ~ F16）\n\n### 数据来源\n\n- llama.cpp\n- Ollama\n- LM Studio\n\n### 支持的模型规模\n\n从 0.6B 到 1T 参数均有覆盖，示例包括：\nLlama 3.1 8B、Qwen 3.5 9B、Phi-4 14B、GPT-OSS 120B、DeepSeek R1、Gemma 3 27B、Llama 3.3 70B 等\n\n### 工具定位\n\n快速评估本地硬件能力、选择合适的模型大小和量化精度，是本地部署大模型的**选型参考工具**。由 midudev 开发，完全免费使用。\n\n## 个人备注\n\n本地大模型部署选型工具，部署前先在这里评估硬件能跑什么模型、该用哪种量化级别。配合 Ollama / llama.cpp / LM Studio 使用效果更佳。\n\n_Last updated: 2026-04-09_\n","path":"0-Resources/4-Tools-Frameworks/canirun.md"}]}]},{"name":"Agent","skills":[{"name":"Agent 原理","items":[{"title":"深入理解 AI Agent","short":"深入理解 AI Agent","desc":"李博杰开源书 45k+★：Agent = LLM + 上下文 + 工具，Harness 工程才是竞争力","date":"2026-09-14","tags":["ai-agent","llm","mcp","fine-tuning","reinforcement-learning","coding-agent","evaluation","book","chinese","open-source"],"content":"\n> 李博杰（bojieli）开源技术书（**45k+ Stars**，Apache 2.0，持续更新，GitHub Actions 自动重建站点）。核心公式：**Agent = LLM + 上下文 + 工具**；核心论断：**\"Harness 工程才是竞争力\"**——设计原则比模型迭代更长寿。中文原版 + 14 种社区翻译，每章附配套实验。\n\n## 章节速览（2026-09 更新）\n\n| 章 | 标题 | 核心内容 |\n|----|------|----------|\n| 1 | Agent 基础知识 | Agent = LLM + 上下文 + 工具；Harness 工程定位 |\n| 2 | 上下文工程 | KV Cache、提示工程、Agent Skills、上下文压缩 |\n| 3 | 用户记忆和知识库 | 用户记忆、RAG、结构化索引、知识图谱 |\n| 4 | 工具 | MCP 协议、感知/执行/协作三类工具、异步 Agent |\n| 5 | Coding Agent 与代码生成 | 代码是\"能创造新工具的工具\"，生产级 Coding Agent 全景 |\n| 6 | Agent 的评估 | 评估环境、指标、统计显著性 |\n| 7 | 模型后训练 | SFT、RL——把 Harness 反馈信号写入模型参数 |\n| 8 | Agent 的持续进化 | 从可靠学习信号到知识、指令、程序与参数更新 |\n| 9 | 多模态与实时交互 | 语音 Agent、Computer Use、机器人操作 |\n| 10 | 多 Agent 协作 | 协作架构、失败模式、Agent 社会 |\n\n## 六条主题线\n\n1. **Harness 工程**——Agent 竞争力关键\n2. **上下文工程**——上下文决定能力上限（KV Cache 视角很工程化）\n3. **记忆与知识增强**——RAG、知识图谱\n4. **工具体系**——MCP 协议与异步 Agent\n5. **评估与后训练**——从评估信号到参数更新\n6. **多模态交互与多 Agent 协作**\n\n## 交付形态\n\n- 在线阅读（默认）；中文 [PDF](https://github.com/bojieli/ai-agent-book/releases/download/latest/AI-Agents-in-Depth-zh-CN.pdf) / [EPUB](https://github.com/bojieli/ai-agent-book/releases/download/latest/AI-Agents-in-Depth-zh-CN.epub)\n- 每章配套实验；附录思考题参考答案\n- ⚠️ 侧边导航与\"章节速览\"偶有目录调整不同步，以速览（更新至 2026-09-03）为准\n\n## 与既有资源的关系\n\n- 与 Agent-Learning-Hub（Datawhale，路线图+项目清单）互补：那本管\"学什么\"，这本管\"为什么这样设计\"\n- 第 2 章上下文工程 / 第 7 章后训练直接衔接 RLHF/推理系统知识；第 5 章 Coding Agent 解释了你正在用的这层工具链\n\n_Last updated: 2026-09-14_","path":"0-Resources/3-Tutorials/bojieli-ai-agent-book.md"}]},{"name":"学习路线","items":[{"title":"Agent-Learning-Hub (Datawhale)","short":"Agent-Learning-Hub","desc":"AI Agent 学习路线，2.9k⭐，8阶段+11项目，可执行清单","date":"2026-06-05","tags":["ai-agent","tutorial","roadmap","datawhale","mcp"],"content":"\n> Datawhale 出品，2.9k⭐，一份有观点、可执行的 AI Agent 学习路线图\n\n## 基本信息\n\n| 项目 | 详情 |\n|------|------|\n| **组织** | Datawhale China |\n| **作者** | 陈思州 |\n| **Star** | 2.9k |\n| **Fork** | 288 |\n| **许可证** | MIT |\n| **在线版** | [datawhalechina.github.io/Agent-Learning-Hub/](https://datawhalechina.github.io/Agent-Learning-Hub/) |\n| **定位** | 不是链接合集，而是有优先级的可执行学习清单 |\n\n## 核心学习原则\n\n- 先动手再深读\n- 宁要一个可靠的智能体，不要十个花哨的演示\n- 在加更多智能体之前先加上评估\n- 把多智能体当作协调问题来对待\n\n## 学习优先级\n\n| 优先级 | 学什么 | 为什么 |\n|--------|--------|--------|\n| 1 | Claude Code / Codex 类编程智能体 | Agent 工程的最佳实践（真实代码库、shell、文件、权限） |\n| 2 | Agent harness 工程 | Agent 能力大部分来自 harness |\n| 3 | OpenClaw / Hermes 类个人智能体 | 长时间运行、本地优先、跨应用、记忆、技能 |\n| 4 | Skills / MCP / A2A / ACP | 技能复用、工具协议、智能体通信 |\n| 5 | 评估与安全 | 没有评估和追踪就只是 demo |\n\n## 8 阶段学习清单\n\n| 阶段 | 内容 |\n|------|------|\n| 0 | 理解 Agent 是什么 — 区分 chatbot/workflow/agent/multi-agent |\n| 1 | 搭建最小 Agent 循环 — LLM API + JSON 输出 + 工具调用 |\n| 2 | 工具使用、RAG 与记忆 — 搜索/数据库/文件/浏览器/代码执行 |\n| 3 | 深入学习一个现代 Agent Harness — Claude Code / OpenClaw / LangGraph |\n| 4 | 多智能体是协调问题 — planner/executor/reviewer 角色 |\n| 5 | Skills 与协议 — MCP / A2A / ACP / SKILL.md |\n| 6 | 浏览器和计算机使用 Agent — Playwright + 安全限制 |\n| 7 | 评估与可观测性 — 测试集、追踪、安全门控 |\n| 8 | 部署真正的 Agent — CLI / Web / Slack / GitHub Action |\n\n## 项目梯子（11 个层级）\n\n| 层级 | 项目 |\n|------|------|\n| 1 | Calculator Agent — 最小工具调用循环 |\n| 2 | Web Research Agent — 搜索、过滤、引用、总结 |\n| 3 | PDF QA Agent — RAG、分块、检索 |\n| 4 | Coding Review Agent — Diff 读取、风险排序 |\n| 5 | Browser Agent — 页面观察、点击、提取 |\n| 6 | Claude Code 类 Nano Agent — shell、文件编辑 |\n| 7 | OpenClaw 类 Gateway — 通道、路由、记忆 |\n| 8 | 可复用技能包 — SKILL.md 模板 |\n| 9 | 多智能体写作器 — planner/writer/reviewer |\n| 10 | 个人 Agent — 记忆、技能、消息入口 |\n| 11 | 生产级 Harness — 评估、追踪、CI |\n\n_Last updated: 2026-06-05_\n","path":"0-Resources/3-Tutorials/agent-learning-hub.md"}]}]},{"name":"工具与可视化","skills":[{"name":"模型可视化","items":[{"title":"LLM Visualization (bbycroft)","short":"LLM Visualization","desc":"GPT 风格 LLM 推理 3D 交互可视化，逐层看注意力/FFN/词元流动（WebGL）","date":"2026-08-01","tags":["llm","transformer","visualization","gpt","interactive","threejs","interpretability"],"content":"\n## 核心要点（摘要）\n\nBrendan Bycroft 制作的 **GPT 风格 LLM 推理 3D 交互可视化**：把网络前向传播的每一步（词元化、词嵌入、位置编码、单层注意力、前馈、残差/归一化、逐词元自回归解码）渲染成可旋转、可缩放、可逐步推进的 3D 模型，是理解 Transformer 内部机制最直观的方式之一。\n\n## 详细内容\n\n- **演示模型**：基于 Andrej Karpathy `minGPT` 的示例权重（一个对 A/B/C 三字排序的极小 GPT 网络）；渲染器也支持任意规模（含 gpt2 尺寸），但大模型权重需自行下载（数百 MB）\n- **技术栈**：WebGL/Three.js 渲染 + TypeScript + Next.js/React（仓库 `bbycroft/llm-viz`）；纯前端，浏览器直接跑\n- **覆盖流程**：Tokenization → Embedding → 位置编码 → 多头注意力（Q/K/V、softmax、加权求和）→ FFN → LayerNorm/残差 → 输出 logits → 自回归生成\n- **价值**：把抽象的矩阵运算变成\"看得见\"的数据流，配合 Karpathy minGPT / nanoGPT 源码食用效果最佳\n- **作者/源码**：Brendan Bycroft · https://github.com/bbycroft/llm-viz\n\n## 个人备注\n\nTransformer 内部结构\"体感\"建立器，与仓库内 nano-vllm / mini-sglang（推理框架层源码）互补：一个看\"网络内部在算什么\"，一个看\"工业级推理怎么调度\"。建议路线——先看本可视化建立注意力/FFN 直觉 → 再读 nanoGPT 源码 → 最后看 inferflux 把推理系统放大到 PD 分离/吞吐维度。\n\n_Last updated: 2026-08-01_\n","path":"0-Resources/4-Tools-Frameworks/llm-viz.md"},{"title":"InferFlux 推理系统可视化","short":"InferFlux 推理系统可视化","desc":"零依赖交互式动画：PD分离模拟/吞吐计算/3D请求生命周期/GPU集合通信（Three.js）","date":"2026-08-01","tags":["inference","visualization","llm","interactive","simulation","sglang","vllm","threejs"],"content":"\n## 核心要点（摘要）\n\n一套面向 **LLM 推理系统** 的交互式、单文件 Web 动画合集（作者 Abatom，CC BY-NC 4.0）。每个页面零依赖、自包含，拖动参数即可实时观察系统行为。对理解 PD 分离、吞吐/KV 容量可行性、Transformer 推理执行序、GPU 集合通信极有帮助。\n\n## 详细内容\n\n- **定位**：把抽象的 LLM 推理系统（调度、并行、带宽墙）变成可拖拽、可旋转的可视化交互\n- **技术栈**：原生 HTML/CSS/JS（零框架）；3D 部分用 Three.js；仓库附带一个 Python HTTPS server 供本地安全上下文访问\n- **许可**：CC BY-NC 4.0（署名-非商业，商业用途需作者授权）\n- **在线访问**：https://Abatom.github.io/inferflux/ ；源码：https://github.com/Abatom/inferflux\n\n### 页面清单\n\n- `index.html` — 首页，各页入口\n- `pd-disagg.html` — **PD 分离模拟器**：忠实还原 SGLang 的 PD 分离请求生命周期，实时联动 TTFT / TPOT / 吞吐 / 排队 / KV 利用率（含 chunked prefill、KV transfer、handshake gating）\n- `calc-input.html` — **输入吞吐计算器**：由模型/GPU/TP/DP/EP/输入长度/缓存命中率推算 prefill 吞吐与 KV 内存可行性，按实测数据反解 MFU（Roofline 视角）\n- `calc-output.html` — **输出吞吐计算器**：推算 decode 输出吞吐与 TPOT，展示 weight/KV 带宽 roofline 拐点，反解 MBU\n- `transformer-3d.html` — **请求生命周期 3D**：依真实执行顺序复现 SGLang `eagle_worker` 全流程（Prefill 全前向→首 token→draft 预热；Decode 草稿提议→目标层并行校验→accept+bonus），展开 attention(MHA/GQA/MQA)+MLP/MoE(top-k+shared expert)+TP/EP/DP 并行；投机为 DFLASH 或 MTP\n- `collective-3d.html` — **GPU 集合通信 3D**：逐帧走查 AllReduce(Ring=ReduceScatter+AllGather)/AllGather/ReduceScatter/Broadcast/All-to-All，按源 GPU 着色，可切换 2/4/8 卡\n- `attention-3d.html` — Attention 机制 3D 可视化\n\n## 个人备注\n\n推理系统层的\"直觉建立器\"：比读文字更快建立对 PD 分离、带宽墙、并行维度的体感。建议路线——先 `calc-input/output` 建立吞吐/KV 容量直觉 → `pd-disagg` 看调度联动 → `transformer-3d` / `collective-3d` 把执行序与通信拓扑钉进脑图。与仓库内 nano-vllm / mini-sglang（推理框架层源码）互补：一个看\"为什么这么设计\"，一个看\"系统跑起来长什么样\"。\n\n_Last updated: 2026-08-01_\n","path":"0-Resources/4-Tools-Frameworks/inferflux.md"}]},{"name":"Tokenizer","items":[{"title":"TikTokenizer 可视化交互工具","short":"TikTokenizer 可视化交互工具","desc":"可视化学习 LLM Tokenizer 工作原理的交互工具 (GPT2/CL100K 等编码器)","date":"2026-04-02","tags":["tool","tokenizer","visualization","interactive","gpt"],"content":"## Summary\n\nTikTokenizer is an interactive web tool for visualizing and understanding how\nLLM tokenizers work. It supports multiple encoders (GPT2, cl100k_base, o200k_base, etc.)\nand lets you input text to see how it gets split into tokens with their indices.\n\n## Use Cases\n\n- Understanding BPE tokenization visually\n- Comparing encodings across different tokenizer versions\n- Debugging token count and splitting behavior in prompts\n\n_Last updated: 2026-04-02_\n","path":"0-Resources/4-Tools-Frameworks/tiktokenizer.md"}]},{"name":"设计与提示词","items":[{"title":"Open Design","short":"Open Design","desc":"Claude Design 开源替代，AI 驱动 artifact-first 设计工具（13 CLI/31 Skills/129 设计系统）","date":"2026-05-05","tags":["ai-design","open-source","coding-agent","local-first"],"content":"\n> Local-first, open-source alternative to Claude Design. Same artifact-first design loop, none of the lock-in.\n> GitHub: https://github.com/nexu-io/open-design\n\n## Overview\n\nOpen Design (OD) 是 Claude Design 的开源替代品。Claude Design 展示了 LLM 产出设计制品（而非纯文本）的潜力，但它闭源、付费、云锁定、绑定 Anthropic 模型。Open Design 用同样的 artifact-first 设计循环，实现零锁定。\n\n**核心理念**：We don't ship an agent. Yours is good enough. — 不内置 Agent 运行时，直接使用你已安装的 coding agent CLI。\n\n## Key Features\n\n| Feature | Description |\n|---------|-------------|\n| **13 种 Agent CLI 适配** | Claude Code / Codex / Devin / Cursor Agent / Gemini CLI / OpenCode / Qwen / GitHub Copilot / Hermes / Kimi / Pi / Kiro / Mistral Vibe，自动检测 PATH，一键切换 |\n| **BYOK 多模型代理** | 支持 Anthropic / OpenAI / Azure OpenAI / Google Gemini，填 baseUrl + apiKey + model 即用 |\n| **31 个组合式 Skills** | 27 prototype + 4 deck 模式，覆盖 Web 原型、移动 App、Dashboard、Pitch Deck、杂志、社交媒体轮播等 |\n| **129 套设计系统** | 2 手写 starter + 70 产品系统（Linear/Stripe/Vercel/Airbnb/Tesla/Notion/Apple 等）+ 57 设计 skill，均为便携式 DESIGN.md |\n| **5 种视觉方向** | Editorial Monocle / Modern Minimal / Warm Soft / Tech Utility / Brutalist Experimental |\n| **交互式需求表单** | Turn 1 展示 discovery form（surface/audience/tone/brand/scale），防止 80% 方向跑偏 |\n| **5 维自评门控** | Philosophy / Hierarchy / Execution / Specificity / Restraint 五维打分后才输出 |\n| **反 AI-slop 机制** | Brand-spec 提取 / P0-P1-P2 检查清单 / slop 黑名单 / 真实占位符替代假数据 |\n| **多格式导出** | HTML / PDF / PPTX / ZIP / Markdown |\n| **Claude Design ZIP 导入** | 可继续在 Anthropic 停下的地方编辑 |\n| **MCP Server** | Stdio MCP server，让 coding agent 直接读取 OD 项目文件 |\n| **多媒体生成** | gpt-image-2 图片 + Seedance 2.0 视频 + HyperFrames HTML→MP4 动效，93 个提示词模板 |\n\n## Tech Stack\n\n| Layer | Technology |\n|-------|-----------|\n| Frontend | Next.js 16 App Router + React 18 + TypeScript |\n| Daemon | Node 24 + Express + SSE streaming + better-sqlite3 |\n| Agent Transport | child_process.spawn + per-CLI typed-event parsers |\n| BYOK Proxy | Provider-specific upstream APIs, normalized SSE, SSRF-guarded |\n| Storage | SQLite (.od/app.sqlite) + plain files in .od/projects/ |\n| Preview | Sandboxed iframe via srcdoc + per-skill artifact parser |\n| Desktop (optional) | Electron shell with sidecar IPC |\n| License | Apache-2.0 |\n\n## Architecture\n\n```\nBrowser (Next.js 16) ←→ Local Daemon (Express + SQLite)\n                              ↓ spawn(cli)\n                         Agent CLIs (claude, codex, gemini, etc.)\n                              ↑ SSE\n                         BYOK Proxy (/api/proxy/{provider}/stream)\n```\n\nDaemon 是唯一的特权进程：在项目的 artifact 文件夹中 spawn 用户的 CLI，给 agent 真实的 Read / Write / Bash / WebFetch 工具。\n\n## 与竞品对比\n\n| 维度 | Claude Design | Open CoDesign | **Open Design** |\n|------|--------------|---------------|-----------------|\n| 可部署到 Vercel | ❌ | ❌ | ✅ |\n| Agent 运行时 | 内置 | 内置 (pi-ai) | **委托给用户 CLI** |\n| Skills 数量 | 专有 | 12 custom TS | **31 file-based** |\n| 设计系统 | 专有 | v0.2 路线图 | **129 已发布** |\n| 需求表单 | ❌ | ❌ | ✅ |\n| 自评门控 | ❌ | ❌ | ✅ |\n\n---\n\n_Last updated: 2026-05-05_\n","path":"0-Resources/4-Tools-Frameworks/open-design.md"},{"title":"GPT Image 2 提示词合集","short":"GPT Image 2 提示词合集","desc":"725+ 精选提示词，JSON 结构化+参数化模板（产品海报/信息图/UI设计/动漫插画）","date":"2026-04-22","tags":["multimodal","prompt-engineering","ai-design"],"content":"\n> 725+ 精选 GPT Image 2 提示词，覆盖产品海报、信息图、UI 设计、动漫插画等场景。\n> 官网: https://youmind.com/gpt-image-2-prompts\n\n## Overview\n\nYouMind 收集整理的 GPT Image 2 提示词库，主要来源于 Twitter/𝕏 上的公开分享。GPT Image 2 是 OpenAI 新一代图像模型（代号 \"duct-tape\"），核心能力：\n1. **多语言像素级文字渲染** — 精确渲染中/日/英等各种语言的文字\n2. **完美的角色一致性** — 同一图像/系列图像中保持角色外观高度一致\n3. **商用级插画品质** — 输出达到商业使用标准\n\n## 分类体系\n\n| 分类 | 说明 |\n|------|------|\n| 个人资料 / 头像 | 社交媒体头像等 |\n| 社交媒体帖子 | 各平台帖文配图 |\n| 信息图 / 教育视觉图 | 知识可视化、教学类 |\n| YouTube 缩略图 | 视频封面图 |\n| 漫画 / 故事板 | 叙事类分镜 |\n| 海报 / 传单 | 宣传物料 |\n| App / 网页设计 | UI/UX 设计类 |\n\n## 提示词编写技巧\n\n### 1. JSON 结构化描述\n大部分高质量提示词采用 JSON 格式，将图像分解为结构化层级：\n- `type` — 图像类型\n- `style` — 整体视觉风格\n- `theme` — 主题/配色\n- `layout` — 布局结构\n- `sections` — 各区域详细定义\n- `header` / `footer` — 顶部/底部元素\n\n### 2. 参数化变量\n使用 `{argument name=\"...\" default=\"...\"}` 实现模板化：\n```\n{argument name=\"city name\" default=\"成都\"}\n{argument name=\"product name\" default=\"Meta Quest 3\"}\n{argument name=\"primary accent color\" default=\"霓虹紫\"}\n```\n一套提示词快速适配不同主题，只需替换参数值。\n\n### 3. 像素级文字渲染控制\n精确指定标题、按钮文案、标签/徽章、价格、统计数据、聊天消息、图例标签。\n\n### 4. 布局精确描述\n明确定义各元素的空间位置：\n- `\"position\": \"左上\"` / `\"右上\"` / `\"左下\"` / `\"右下\"`\n- 网格结构：`\"structure\": \"4 个等分象限\"`\n\n### 5. 组件化设计思维\n将复杂图像拆解为独立组件：卡片、图标、按钮、进度条、数据可视化、导航栏。\n\n### 6. 自然语言叙述式（适用于艺术插画）\n非 UI 类图像（如动漫场景）采用自然语言叙述：精确描述角色外观、动作与能量效果、环境背景、光影与氛围。\n\n### 7. 引用参考图\n```\n\"instruction\": \"以 REFERENCE_0 作为结构基础，将平面矢量设计转化为高度逼真的 3D 信息图。\"\n```\n\n## 精选示例速览\n\n| 示例 | 类型 | 核心技巧 |\n|------|------|----------|\n| VR 头显爆炸视图海报 | 产品海报 | JSON 结构 + 组件标注 + 参数化产品名 |\n| 手绘城市美食地图 | 信息图 | 参数化城市/美食 + 图例系统 |\n| 桃太郎讲解 Slides | 教育视觉图 | 自然语言风格混合描述 |\n| 电商直播 UI 样机 | UI 设计 | 复杂嵌套 JSON + 聊天/商品/礼物组件 |\n| 动漫武术对决 | 艺术插画 | 自然语言叙述式（非 JSON） |\n| 3D 石阶演化信息图 | 信息图 | 参考图引用 + 阶梯布局 |\n| 动漫角色品牌形象 | 品牌设计 | 多模块布局（包装/海报/周边） |\n| 浅色模式 UI 设计系统 | UI 设计 | 组件库展示（色彩/排版/按钮/导航） |\n| 4 格日式广告横幅 | 广告设计 | 2x2 网格 + 四象限独立主题 |\n| 深色模式营销落地页 | UI 设计 | 完整页面原型 + 数据可视化 |\n\n---\n\n_Last updated: 2026-04-22_\n","path":"0-Resources/4-Tools-Frameworks/gpt-image-2-prompts.md"}]}]}]};

// 现代简约低饱和度色板
const COLORS = ["#64748b", "#2563eb", "#059669", "#d97706", "#7c3aed", "#db2777", "#0891b2", "#4f46e5"];
const REPO = "https://github.com/70asunflower/ai-learning-journey/blob/master/";
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = (s, n = 36) => s.length > n ? s.slice(0, n) + "…" : s;

// 根据标签提取资源类型，帮助判断学习方式
function getResourceKind(tags) {
  if (tags.includes("from-scratch")) return "手搓实战";
  if (tags.includes("book")) return "书籍";
  if (tags.includes("course")) return "系统课程";
  if (tags.includes("docs")) return "官方文档";
  if (tags.includes("framework")) return "框架源码";
  if (tags.includes("visualization")) return "交互可视化";
  if (tags.includes("roadmap")) return "学习路线";
  if (tags.includes("blog")) return "博客专栏";
  if (tags.includes("video")) return "视频";
  if (tags.includes("tool") || tags.includes("benchmarking")) return "工具";
  return "教程";
}

const folded = new Set();
let focusTrunk = -1;
let query = "";
let selectedPath = "";

const trunks = [
  { ...TREE.foundation, isBase: true },
  ...TREE.branches.map(b => ({ ...b, isBase: false }))
].map((t, i) => ({ name: t.name, skills: t.skills, isBase: t.isBase, i }));

el("nTrunk").textContent = `1 个基础层 + ${TREE.branches.length} 个技术方向`;
el("nSkill").textContent = trunks.reduce((a, t) => a + t.skills.length, 0);
el("nLeaf").textContent = trunks.reduce((a, t) => a + t.skills.reduce((b, s) => b + s.items.length, 0), 0);

// 渲染顶部筛选按钮
el("legend").innerHTML = `<button class="lg on" data-i="-1" type="button"><i style="background:var(--ink)"></i>全部路径</button>` +
  trunks.map(t => `<button class="lg" data-i="${t.i}" type="button" style="--c:${COLORS[t.i]}"><i></i>${esc(t.name)}</button>`).join("");

function setFocusTrunk(idx, updateHash = true) {
  focusTrunk = idx;
  el("legend").querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", +b.dataset.i === idx);
  });
  if (updateHash) {
    if (idx === -1) {
      history.replaceState(null, "", location.pathname + location.search);
    } else {
      location.hash = "path=" + encodeURIComponent(trunks[idx].name);
    }
  }
  render();
}

el("legend").querySelectorAll("button").forEach(b => {
  b.onclick = () => setFocusTrunk(+b.dataset.i);
});

function curve(x1, y1, x2, y2) {
  const dx = Math.max(36, (x2 - x1) * 0.5);
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function render() {
  const ROW = 36, PAD = 24;
  const nodes = [], wires = [];
  let row = 0;
  const yOfLeaf = () => (row++ * ROW + ROW / 2 + PAD);
  const trunkYs = [];
  let dividerY = null;

  trunks.forEach((t, idx) => {
    const c = COLORS[t.i], tk = "t" + t.i, tFold = folded.has(tk);
    const skillYs = [];

    t.skills.forEach((s, si) => {
      const sk = tk + "s" + si, sFold = folded.has(sk) || tFold;
      const leafYs = [];
      if (!sFold) s.items.forEach(() => leafYs.push(yOfLeaf()));
      const sy = leafYs.length ? leafYs.reduce((a, b) => a + b, 0) / leafYs.length : yOfLeaf();
      skillYs.push(sy);

      nodes.push(`
        <div class="node n-skill ${s.items.length ? '' : 'empty'}" id="node-${sk}" data-t="${t.i}" data-s="${sk}" style="top:${sy - 14}px;--c:${c}" data-key="${sk}" title="${s.items.length ? '点击展开或收起资源' : '暂无资源'}">
          <span>${esc(s.name)}</span>
          <span class="fold">${s.items.length ? (sFold ? '+' : '−') : '0'}</span>
        </div>
      `);

      if (!sFold) {
        s.items.forEach((it, li) => {
          const y = leafYs[li];
          const text = (it.title + " " + it.desc + " " + it.tags.join(" ")).toLowerCase();
          const hit = query && text.includes(query);
          const faded = query && !hit;
          const kind = getResourceKind(it.tags);
          const isSelected = selectedPath === it.path;

          nodes.push(`
            <div class="node n-leaf ${hit ? 'hit' : ''} ${faded ? 'faded' : ''} ${isSelected ? 'selected' : ''}"
              data-t="${t.i}" data-s="${sk}" data-path="${esc(it.path)}"
              style="top:${y - 13}px;--c:${c}">
              <span class="pip">${String(li + 1).padStart(2, '0')}</span>
              <span class="txt">${esc(short(it.short || it.title))}</span>
              <span class="kind">${esc(kind)}</span>
            </div>
          `);
          wires.push(`<path d="${curve(624, sy, 672, y)}" stroke="${c}" stroke-width="1.2" stroke-opacity="0.35" fill="none" data-t="${t.i}" data-s="${sk}" data-leaf="${esc(it.path)}"/>`);
        });
      }
    });

    const ty = skillYs.reduce((a, b) => a + b, 0) / skillYs.length;
    trunkYs.push(ty);

    nodes.push(`
      <div class="node n-trunk" id="node-${tk}" data-t="${t.i}" style="top:${ty - 17}px;--c:${c}" data-key="${tk}" title="点击展开或收起该方向">
        <span>${esc(t.name)}</span>
        ${t.isBase ? '<span class="badge-base">前置</span>' : ''}
        <span class="cnt">${t.skills.reduce((a, s) => a + s.items.length, 0)}</span>
        <span class="fold">${tFold ? '+' : '−'}</span>
      </div>
    `);

    skillYs.forEach((sy, si) => {
      const sk = tk + "s" + si;
      wires.push(`<path d="${curve(394, ty, 440, sy)}" stroke="${c}" stroke-width="1.5" stroke-opacity="0.55" fill="none" data-t="${t.i}" data-s="${sk}"/>`);
    });

    // 在基础层之后记录分隔线位置
    if (idx === 0) {
      row += 0.4;
      dividerY = row * ROW + PAD - ROW * 0.2;
    }
  });

  const ry = trunkYs.reduce((a, b) => a + b, 0) / trunkYs.length;
  nodes.push(`
    <div class="node n-root" style="top:${ry - 26}px">
      <span>AI 技术栈</span>
      <small>7 大进阶方向</small>
    </div>
  `);
  trunkYs.forEach((ty, i) => {
    wires.push(`<path d="${curve(160, ry, 210, ty)}" stroke="${COLORS[i]}" stroke-width="2" stroke-opacity="0.7" fill="none" data-t="${i}"/>`);
  });

  const tree = el("tree"), H = row * ROW + PAD * 2, W = 1220;
  tree.style.height = H + "px";
  tree.style.width = W + "px";

  const svg = el("wires");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.innerHTML = wires.join("");

  let dividerHTML = "";
  if (dividerY !== null) {
    dividerHTML = `<div class="divider-line" style="top:${dividerY}px"></div><div class="divider-label" style="top:${dividerY}px">进阶技术方向</div>`;
  }
  el("nodes").innerHTML = dividerHTML + nodes.join("");

  // 折叠事件
  el("nodes").querySelectorAll("[data-key]").forEach(n => {
    n.onclick = () => {
      const k = n.dataset.key;
      folded.has(k) ? folded.delete(k) : folded.add(k);
      render();
    };
  });

  // 应用主干聚焦过滤
  applyFocusState();
  bindLeafEvents();
}

function applyFocusState() {
  el("nodes").querySelectorAll(".node").forEach(n => {
    if (n.classList.contains("n-root")) return;
    n.classList.toggle("dim", focusTrunk !== -1 && +n.dataset.t !== focusTrunk);
  });
  el("wires").querySelectorAll("path").forEach(p => {
    const match = focusTrunk === -1 || +p.dataset.t === focusTrunk;
    p.style.opacity = match ? "1" : "0.08";
  });
}

// 悬停高亮完整路径 + 点击打开右侧详情抽屉
function bindLeafEvents() {
  el("nodes").querySelectorAll(".n-leaf").forEach(leaf => {
    const tIdx = leaf.dataset.t;
    const sKey = leaf.dataset.s;
    const path = leaf.dataset.path;

    leaf.addEventListener("mouseenter", () => {
      el("node-t" + tIdx)?.classList.add("active-path");
      el("node-" + sKey)?.classList.add("active-path");
      el("wires").querySelectorAll("path").forEach(p => {
        const isBranchRootWire = p.dataset.t === tIdx && !p.dataset.s;
        const isSkillWire = p.dataset.s === sKey && !p.dataset.leaf;
        const isLeafWire = p.dataset.leaf === path;
        if (isBranchRootWire || isSkillWire || isLeafWire) {
          p.style.opacity = "1";
          p.setAttribute("stroke-width", "2.4");
        } else {
          p.style.opacity = "0.12";
        }
      });
    });

    leaf.addEventListener("mouseleave", () => {
      el("node-t" + tIdx)?.classList.remove("active-path");
      el("node-" + sKey)?.classList.remove("active-path");
      el("wires").querySelectorAll("path").forEach(p => {
        const isRootWire = !p.dataset.s;
        const isSkillWire = p.dataset.s && !p.dataset.leaf;
        p.setAttribute("stroke-width", isRootWire ? "2" : (isSkillWire ? "1.5" : "1.2"));
      });
      applyFocusState();
    });

    leaf.addEventListener("click", () => openDrawer(path));
  });
}

// 详情抽屉控制
function openDrawer(path) {
  let found = null;
  trunks.forEach(t => {
    t.skills.forEach(s => {
      s.items.forEach(it => {
        if (it.path === path) found = { item: it, trunk: t, skill: s };
      });
    });
  });
  if (!found) return;

  selectedPath = path;
  el("nodes").querySelectorAll(".n-leaf").forEach(n => {
    n.classList.toggle("selected", n.dataset.path === path);
  });

  const c = COLORS[found.trunk.i];
  el("dPath").innerHTML = `<i style="background:${c}"></i> ${esc(found.trunk.name)} / ${esc(found.skill.name)}`;
  el("dTitle").textContent = found.item.title;
  el("dDesc").textContent = found.item.desc;
  el("dTags").innerHTML = found.item.tags.map(tag => `<span>#${esc(tag)}</span>`).join("");
  el("dMeta").textContent = `收录日期: ${found.item.date} · 路径: ${found.item.path}`;
  el("dLink").href = REPO + found.item.path;
  el("dBody").innerHTML = (window.marked && found.item.content)
    ? marked.parse(found.item.content)
    : '<p style="color:var(--muted)">正文暂不可用，请点击下方链接查看原文。</p>';
  el("dBody").scrollTop = 0;

  el("drawerMask").classList.add("open");
  el("drawer").classList.add("open");
  el("drawer").setAttribute("aria-hidden", "false");
}

function closeDrawer() {
  selectedPath = "";
  el("nodes").querySelectorAll(".n-leaf.selected").forEach(n => n.classList.remove("selected"));
  el("drawerMask").classList.remove("open");
  el("drawer").classList.remove("open");
  el("drawer").setAttribute("aria-hidden", "true");
}

el("dClose").onclick = closeDrawer;
el("drawerMask").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
});

// 展开/收起按钮
el("expand").onclick = () => { folded.clear(); render(); };
el("collapse").onclick = () => {
  folded.clear();
  trunks.forEach((t, i) => {
    folded.add("t" + i);
    t.skills.forEach((_, j) => folded.add("t" + i + "s" + j));
  });
  render();
};

// 搜索联动
el("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  if (query) {
    folded.clear();
    trunks.forEach((t, ti) => t.skills.forEach((s, si) => {
      const has = s.items.some(it => (it.title + " " + it.desc + " " + it.tags.join(" ")).toLowerCase().includes(query));
      if (has) folded.delete("t" + ti + "s" + si);
      else folded.add("t" + ti + "s" + si);
    }));
  }
  render();
});

// 日间/夜间模式切换
el("theme").onclick = () => {
  const d = document.documentElement;
  const isDark = d.getAttribute("data-theme") !== "dark";
  d.setAttribute("data-theme", isDark ? "dark" : "light");
  el("theme").dataset.tip = isDark ? "切换到日间模式" : "切换到夜间模式";
};

// 初始化解析 URL Hash（支持 #path=推理与部署）
function initFromHash() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (hash.startsWith("path=")) {
    const targetName = hash.slice(5);
    const matched = trunks.find(t => t.name === targetName);
    if (matched) {
      setFocusTrunk(matched.i, false);
      return;
    }
  }
  render();
}

initFromHash();
</script>
</body>
